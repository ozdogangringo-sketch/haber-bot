# =========================================================
#  TESTLER — her push'ta çalışır
#
#  NİYE VAR: bu projede kusurların çoğu "aynı kural birden fazla
#  yerde yaşıyor ve biri unutuluyor" deseninde. Örnekler:
#    * mükerrer engeli üç yerde gerekiyordu, ikisine konmuştu
#    * prompt'un bir kopyası güncellendi, ikincisi unutuldu
#    * config'deki ayar kod tarafından hiç okunmuyordu
#    * `oneri_esigi` silindi, hata ancak GECE cron çalışınca çıktı
#
#  Bu testler ağa çıkmıyor, veritabanına dokunmuyor, para
#  harcamıyor — saniyeler sürüyor. Amaç: bozuk kodu push anında
#  yakalamak, gece yarısı cron patlayana kadar beklememek.
# =========================================================

name: Testler

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "worker/**"
      - "config.yaml"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Bütünlük testi (çağrılar ve imzalar)
        run: python tests/test_0_butunluk.py

      - name: Sözleşme testleri (davranış kuralları)
        run: python tests/test_7_sozlesme.py

      # "🎙️ Sesli Yayınla" (2026-09-26, postedm'den): okunuş sabotaj tablosu, ne okunur,
      # ses seçimi, karıştırma, zamanlama; Worker'ı gerçekten çağıran menü/komut testleri
      - name: Seslendirme testleri
        run: |
          python tests/test_okunus.py
          python tests/test_seslendirme.py
          node --test tests/worker_sesli.test.mjs

      # OzBorn Studio uygulama köprüsü (7 Eki 2026): bot imzası, Telegram onaylı
      # eşleştirme, belirtecin bir kez verilmesi, komutların Telegram düğmesiyle
      # aynı yoldan gitmesi. D1 yerine Node'un yerleşik SQLite'ı kullanılıyor —
      # o modül Node 22.5+ ister; sürümü sabitliyoruz ki test SESSİZCE atlanmasın.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Uygulama köprüsü testleri (Worker)
        run: node --test tests/worker_kopru.test.mjs

# =========================================================
#  ONAY HATIRLATMASI
#
#  Akşam hazırlanan tur onaylanmadıysa hatırlatır, gece yarısına
#  doğru da havuza geri koyar.
#
#  Saatler UTC (TR = UTC+3, yaz saati yok):
#      TR 21:07 -> UTC 18:07   1. hatırlatma
#      TR 22:07 -> UTC 19:07   2. hatırlatma
#      TR 23:07 -> UTC 20:07   havuza dön
#
#  BU JOB TELEGRAM'I OKUMUYOR. Webhook kurulu olduğu için getUpdates
#  zaten çalışmaz; job yalnızca veritabanına bakıp "hâlâ onay
#  bekliyor mu?" diye kontrol ediyor.
# =========================================================

name: Onay Hatırlat

on:
  schedule:
    - cron: "7 18,19,20 * * *"
  workflow_dispatch:

concurrency:
  group: onay-hatirlat
  cancel-in-progress: false

jobs:
  hatirlat:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hatırlat veya havuza döndür
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/hatirlat.py

      - name: Veritabanını kaydet
        if: always()
        run: |
          git config user.name "haber-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/haber.db || true
          git diff --staged --quiet || git commit -m "Hatırlatma turu $(date -u +%Y-%m-%dT%H:%M)"
          git push || (git pull --rebase && git push)

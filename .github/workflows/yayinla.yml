# =========================================================
#  ONAY KOMUTUNU İŞLE
#
#  Cloudflare Worker `repository_dispatch` ile tetikliyor.
#  Telegram'da bir butona basıldığında çalışan job budur.
#
#  Worker yalnızca doğrulanmış komutları gönderiyor; buraya
#  keyfi bir event_type gelemiyor.
# =========================================================

name: Onay Komutunu İşle

on:
  repository_dispatch:
    types: [telegram_onay]

# Aynı anda iki komut işlenmesin: "yayınla" ile "iptal" çakışırsa
# veritabanı tutarsız kalır. Sıraya alıyoruz, iptal ETMİYORUZ —
# yarıda kesilen bir yayın çift post riski doğurur.
concurrency:
  group: veritabani
  cancel-in-progress: false

jobs:
  isle:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # veritabanını geri commit etmek için

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Komutu uygula
        env:
          KOMUT: ${{ github.event.client_payload.komut }}
          MESAJ_ID: ${{ github.event.client_payload.mesaj_id }}
          BASAN: ${{ github.event.client_payload.basan }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_API_KEY: ${{ secrets.GEMINI_IMAGE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Threads'in kendi API'si ve kendi jetonu var; Instagram/Facebook
          # jetonu burada ÇALIŞMIYOR. Secret tanımlı değilse boş geliyor ve
          # `threads.kullanilabilir_mi()` False dönüp paylaşımı atlıyor —
          # yani jeton gelmeden önce de bu satırlar zararsız.
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          # "/tur" yazılı komutu yeni bir tur kuruyor; kalan her şey
          # açık turun üstünde işlem yapıyor.
          KOMUT="${{ github.event.client_payload.komut }}"
          if [ "$KOMUT" = "tur" ]; then
            python scripts/hazirla.py
          elif [ "$KOMUT" = "arsiv" ]; then
            # Paylaşılmamış eski turları Threads'e taşır. Bir seferde en
            # fazla 3 tur: her tur halka aralıklarıyla dakikalar sürüyor
            # ve art arda çok zincir atmak hesabı spam gibi gösteriyor.
            # Kalanlar için komut tekrar verilir; zaten paylaşılan tur
            # veritabanındaki işaret sayesinde atlanıyor.
            python scripts/gecmisi_paylas.py --adet 3
          else
            python scripts/onay_isle.py
          fi

      - name: Veritabanını kaydet
        # Runner her çalıştırmada sıfırlanıyor; commit etmezsek haber
        # geçmişi ve "yayınlandı" işaretleri kaybolur, aynı haber
        # ertesi gün tekrar yayınlanır.
        # `always()`: komut patlasa bile o ana kadarki durum kaydedilmeli.
        if: always()
        run: |
          # ⚠️ ÇIPLAK `git rebase` KULLANMA — `data/haber.db` ikili dosya,
          # iki job aynı anda yazınca çakışıyor ve rebase YARIM KALIYOR.
          # 18 Ağu 2026 akşam turunu bu düşürdü: tur hazırlandı, push
          # reddedildi, rebase çakıştı, job kırmızı oldu ve tur kayboldu.
          # db_senkron çakışmayı kendisi çözüyor, çözemezse rebase'i
          # iptal edip repoyu temiz bırakıyor.
          python scripts/db_kaydet.py "Yayın sonucu" --ek assets/flags

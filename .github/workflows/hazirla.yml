# =========================================================
#  AKŞAM TURUNU HAZIRLA
#
#  RSS → metin → görsel → imgbb → Telegram onayı.
#  YAYINLAMAZ; yalnızca hazırlar ve gruba sorar.
#
#  SAAT DİLİMİ TUZAĞI: cron UTC çalışıyor. Türkiye UTC+3 ve yaz
#  saati uygulaması YOK, yani fark yıl boyunca sabit 3 saat.
#      TR 20:07  ->  UTC 17:07
#
#  Dakika neden :07: GitHub cron'ları tam saat başlarında yoğun
#  oluyor ve 5-30 dakika gecikebiliyor. Sapa bir dakika daha çabuk
#  başlıyor.
# =========================================================

name: Turu Hazırla

on:
  schedule:
    - cron: "7 17 * * *"      # TR 20:07
  workflow_dispatch:           # Actions ekranından elle de çalıştırılabilir
    inputs:
      kuru:
        description: "Kuru çalışma (Telegram'a GÖNDERME, sadece üret)"
        type: boolean
        default: false
      metinsiz:
        description: "Gemini'ye HİÇ gitme — metni hazır haberlerle tur kur (kota dolduysa)"
        type: boolean
        default: false

# ⚠️ ORTAK GRUP — veritabanına yazan HER workflow bu grupta olmalı.
#
# 17 Ağu 2026: akşam turu 14 dakika sürerken, ayrı gruptaki onay job'ı
# araya girip data/haber.db'yi push etti. Turun push'u reddedildi,
# `git pull --rebase` ikili dosyada çakıştı ve YARIM KALDI — repo
# detached HEAD'de kilitlendi, turun veritabanı GitHub'a hiç yazılamadı.
# Onaya basılınca "bu onay mesajına bağlı haber bulunamadı" geldi.
#
# İkili bir dosyada birleştirme diye bir şey yok; tek gerçek çözüm iki
# job'ı aynı anda çalıştırmamak. Grup adını değiştirme.
concurrency:
  group: veritabani
  cancel-in-progress: false

jobs:
  hazirla:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Turu hazırla
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_API_KEY: ${{ secrets.GEMINI_IMAGE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.kuru }}" = "true" ]; then
            python scripts/hazirla.py --kuru
          elif [ "${{ inputs.metinsiz }}" = "true" ]; then
            # Gemini kotası dolduğunda turu tamamen kaçırmamak için:
            # metni ZATEN üretilmiş haberlerle tur kurar, hiç LLM çağırmaz.
            python scripts/hazirla.py --metinsiz
          else
            python scripts/hazirla.py
          fi

      - name: Veritabanını kaydet
        if: always()
        run: |
          # ⚠️ ÇIPLAK `git rebase` KULLANMA — `data/haber.db` ikili dosya,
          # iki job aynı anda yazınca çakışıyor ve rebase YARIM KALIYOR.
          # 18 Ağu 2026 akşam turunu bu düşürdü: tur hazırlandı, push
          # reddedildi, rebase çakıştı, job kırmızı oldu ve tur kayboldu.
          # db_senkron çakışmayı kendisi çözüyor, çözemezse rebase'i
          # iptal edip repoyu temiz bırakıyor.
          python scripts/db_kaydet.py "Tur hazırlandı" --ek assets/flags

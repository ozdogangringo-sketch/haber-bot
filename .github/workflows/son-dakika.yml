# =========================================================
#  SON DAKİKA KONTROLÜ
#
#  Gün içinde saat başı bakar: puanı eşiği geçen taze bir haber
#  çıktıysa 2 slaytlık post hazırlayıp onaya sunar.
#
#  ÇOĞU ÇALIŞTIRMA HİÇBİR ŞEY YAPMAZ — bu normaldir. Eşiği geçen
#  haber yoksa ~1 dakikada sessizce çıkar.
#
#  KOTA: private repo 2000 dk/ay. Ölçüldü:
#      boş kontrol ~1.2 dk × 20 kontrol/gün (16 gündüz + 4 gece)
#      akşam turu  ~4-7 dk,  onay job'ları ~1 dk
#    toplam ~1170 dk/ay (%58). Sıkışırsa gündüz cron'unu
#    "5 4-19/2 * * *" yapıp yarıya indir.
#
#  ⚠️ Sınır aşılırsa Actions TAMAMEN durur — akşam turu da çalışmaz.
#
#  GECE FARKLI DAVRANIYOR (17 Ağu 2026):
#    gündüz TR 07-23  -> saat başı, eşik 8, onay ömrü 1 saat
#    gece  TR 23-07   -> 2 saatte bir, eşik 9, onay sabah 08:00'e kadar
#
#  Gece neden farklı: onaylayacak kimse uyanık değil. Gündüzki 1
#  saatlik ömür gece anlamsız — 03:00'te hazırlanan post 04:00'te
#  iptal olurdu. Ömür sabaha uzatıldı, ama karşılığında eşik 9'a
#  çıktı: sabaha kalan post 5-8 saatlik bir haber oluyor ve bu
#  gecikmeyi ancak gerçekten büyük bir olay hak ediyor.
# =========================================================

name: Son Dakika Kontrolü

on:
  # ⚠️ GITHUB `schedule:` CRON'LARI KALDIRILDI (4 Eyl 2026).
  #
  # Aynı cron'lar `worker/wrangler.toml` içinde de vardı
  # (`"12 5-20 * * *"` ve `"12 23,2 * * *"`) ve Worker bunları
  # `repository_dispatch: son_dakika_calistir` ile tetikliyor.
  # Yani AYNI İŞ İKİ KAYNAKTAN çalışıyordu.
  #
  # ÖLÇÜLDÜ (son 30 çalışma): 22'si Cloudflare'den, 8'i GitHub'dan.
  # Cloudflare dakikası dakikasına (hepsi :12:55); GitHub'ın kendi
  # cron'u 01:05, 07:08, 09:41, 14:28, 18:34, 21:40'ta çalışmış —
  # 90 DAKİKAYA VARAN GECİKME. Yani hem gereksiz hem güvenilmez olan
  # taraf GitHub'dı.
  #
  # Kazanç: günde ~8 gereksiz çalışma. Ayrıca `veritabani` concurrency
  # grubunda bir kuyruk yeri daha az işgal ediliyor (1ab: GitHub o
  # grupta yalnızca BİR bekleyen job tutuyor, yenisi öncekini siliyor).
  #
  # ⚠️ YEDEK YOK ARTIK: Worker patlarsa saatlik kontrol HİÇ çalışmaz.
  # Belirtisi — Telegram'a saat başı öneri düşmemesi. Teşhis sırası:
  # (1) `npx wrangler tail` ile canlı Worker hatası,
  # (2) `npx wrangler deployments status` ile canlı sürüm,
  # (3) gerekirse bu bloğu geri açıp GitHub cron'unu yeniden kur.
  # Telegram'daki "🔄 Son dakika kontrolünü tekrar çalıştır" düğmesi
  # buraya geliyor. Önce böyle bir yol yoktu ve son dakika hatasındaki
  # düğme akşam turunu tetikliyordu.
  # ⚠️ `planli_yayin` AYRI BİR OLAY (5 Eyl 2026). Cloudflare 10
  # dakikada bir KV'deki "çalar saat"e bakıyor ve yalnızca zamanı
  # gelmiş bir plan varsa bunu atıyor. Aynı workflow çalışıyor ama
  # `--sadece-planli` ile: birkaç SELECT, haber taraması yok.
  # Sıklığı `son_dakika_calistir` ile artırmak kotayı patlatırdı
  # (+1620 dk/ay; ölçüm CLAUDE.md'de).
  repository_dispatch:
    types: [son_dakika_calistir, planli_yayin]

  workflow_dispatch:
    inputs:
      kuru:
        description: "Kuru çalışma (Telegram'a GÖNDERME)"
        type: boolean
        default: false

# Akşam turuyla aynı anda çalışırsa ikisi de aynı havuza yazar.
# Sıraya alıyoruz; iptal ETMİYORUZ, yarıda kesilen tur veritabanını
# tutarsız bırakır.
concurrency:
  group: veritabani
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Son dakika var mı?
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_API_KEY: ${{ secrets.GEMINI_IMAGE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Gece otomatik yayını buradan çıkıyor ve o da Threads'e
          # gönderiyor; anahtar yoksa sessizce atlanıyor.
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event.action }}" = "planli_yayin" ]; then
            # Hafif mod: yalnızca zamanı gelen planlı yayınlar.
            python scripts/son_dakika.py --sadece-planli
          elif [ "${{ inputs.kuru }}" = "true" ]; then
            python scripts/son_dakika.py --kuru --elle
          elif [ -n "${{ github.event.client_payload.komut }}" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/son_dakika.py --elle
          else
            python scripts/son_dakika.py
          fi

      - name: Veritabanını kaydet
        if: always()
        run: |
          # ⚠️ ÇIPLAK `git rebase` KULLANMA — `data/haber.db` ikili dosya,
          # iki job aynı anda yazınca çakışıyor ve rebase YARIM KALIYOR.
          # 18 Ağu 2026 akşam turunu bu düşürdü: tur hazırlandı, push
          # reddedildi, rebase çakıştı, job kırmızı oldu ve tur kayboldu.
          # db_senkron çakışmayı kendisi çözüyor, çözemezse rebase'i
          # iptal edip repoyu temiz bırakıyor.
          python scripts/db_kaydet.py "Son dakika kontrolü" --ek assets/flags

# =========================================================
#  SON DAKİKA KONTROLÜ
#
#  Gün içinde saat başı bakar: puanı eşiği geçen taze bir haber
#  çıktıysa 2 slaytlık post hazırlayıp onaya sunar.
#
#  ÇOĞU ÇALIŞTIRMA HİÇBİR ŞEY YAPMAZ — bu normaldir. Eşiği geçen
#  haber yoksa ~1 dakikada sessizce çıkar.
#
#  KOTA: private repo 2000 dk/ay. Ölçüldü:
#      boş kontrol ~1.2 dk × 20 kontrol/gün (16 gündüz + 4 gece)
#      akşam turu  ~4-7 dk,  onay job'ları ~1 dk
#    toplam ~1170 dk/ay (%58). Sıkışırsa gündüz cron'unu
#    "5 4-19/2 * * *" yapıp yarıya indir.
#
#  ⚠️ Sınır aşılırsa Actions TAMAMEN durur — akşam turu da çalışmaz.
#
#  GECE FARKLI DAVRANIYOR (17 Ağu 2026):
#    gündüz TR 07-23  -> saat başı, eşik 8, onay ömrü 1 saat
#    gece  TR 23-07   -> 2 saatte bir, eşik 9, onay sabah 08:00'e kadar
#
#  Gece neden farklı: onaylayacak kimse uyanık değil. Gündüzki 1
#  saatlik ömür gece anlamsız — 03:00'te hazırlanan post 04:00'te
#  iptal olurdu. Ömür sabaha uzatıldı, ama karşılığında eşik 9'a
#  çıktı: sabaha kalan post 5-8 saatlik bir haber oluyor ve bu
#  gecikmeyi ancak gerçekten büyük bir olay hak ediyor.
# =========================================================

name: Son Dakika Kontrolü

on:
  schedule:
    # GÜNDÜZ: TR 07:05-22:05, 90 DAKİKADA BİR (11 çalışma).
    #
    # ⚠️ 90 dakika tek cron satırıyla yazılamıyor — dakika her turda
    # kayıyor (05, 35, 05...), bu yüzden iki satır: tam saatler ve
    # buçuklar ayrı. Birini değiştirirsen diğerini de değiştir.
    #
    # 20 Ağu 2026'da yarım saatten 90 dakikaya ÇEKİLDİ. Sebep ölçüm:
    # Actions kullanımı 2636/3000 dk/ay (%88) çıktı ve en büyük kalem
    # bu kontroldü (~986 dk/ay). Ayrıca faturalamanın %35'i YUVARLAMA
    # KAYBIYDI — GitHub her job'ı yukarı yuvarlıyor, 25 çalışmanın
    # 27.4 dakikalık gerçek işi 42 dakika faturalanıyordu.
    #
    # ⚠️ Kayıp göründüğünden az: GitHub zamanlanmış çalıştırmaların bir
    # kısmını zaten atlıyor. Ölçüldü — 30 dakikalık cron gerçekte
    # ortalama 56 dakika aralıkla çalışıyordu (9-98 dk arası).
    - cron: "5 4,7,10,13,16,19 * * *"
    - cron: "35 5,8,11,14,17 * * *"
    # UTC 20:05,22:05,00:05,02:05 = TR 23:05,01:05,03:05,05:05 (gece)
    # GECE: TR 23:05 / 02:05 / 05:05 — 3 SAATTE BİR (2 saatten
    # çekildi). Gece eşiği zaten 9 ve o saatte onaylayacak kimse
    # uyanık değil; sık bakmanın karşılığı yok.
    - cron: "5 20,23,2 * * *"
  # Telegram'daki "🔄 Son dakika kontrolünü tekrar çalıştır" düğmesi
  # buraya geliyor. Önce böyle bir yol yoktu ve son dakika hatasındaki
  # düğme akşam turunu tetikliyordu.
  repository_dispatch:
    types: [son_dakika_calistir]

  workflow_dispatch:
    inputs:
      kuru:
        description: "Kuru çalışma (Telegram'a GÖNDERME)"
        type: boolean
        default: false

# Akşam turuyla aynı anda çalışırsa ikisi de aynı havuza yazar.
# Sıraya alıyoruz; iptal ETMİYORUZ, yarıda kesilen tur veritabanını
# tutarsız bırakır.
concurrency:
  group: veritabani
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Son dakika var mı?
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_API_KEY: ${{ secrets.GEMINI_IMAGE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Gece otomatik yayını buradan çıkıyor ve o da Threads'e
          # gönderiyor; anahtar yoksa sessizce atlanıyor.
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.kuru }}" = "true" ]; then
            python scripts/son_dakika.py --kuru
          else
            python scripts/son_dakika.py
          fi

      - name: Veritabanını kaydet
        if: always()
        run: |
          # ⚠️ ÇIPLAK `git rebase` KULLANMA — `data/haber.db` ikili dosya,
          # iki job aynı anda yazınca çakışıyor ve rebase YARIM KALIYOR.
          # 18 Ağu 2026 akşam turunu bu düşürdü: tur hazırlandı, push
          # reddedildi, rebase çakıştı, job kırmızı oldu ve tur kayboldu.
          # db_senkron çakışmayı kendisi çözüyor, çözemezse rebase'i
          # iptal edip repoyu temiz bırakıyor.
          python scripts/db_kaydet.py "Son dakika kontrolü" --ek assets/flags

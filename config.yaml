# =========================================================
#  Haber Botu Ayarları
#  Burada API key YOK. Key'ler .env dosyasında durur.
#  Bu dosyayı rahatça git'e commit edebilirsin.
# =========================================================

genel:
  # NOT: zaman dilimi ayarı YOK. Türkiye UTC+3 ve yaz saati uygulaması
  # kaldırıldı, yani fark yıl boyunca sabit. Kod bunu doğrudan
  # kullanıyor (son_dakika._tr_saat). Kütüphaneye bağımlılık eklemenin
  # anlamı yok — DST olsaydı gerekirdi.

  # RSS'ten çekerken: kaç saatten eski haberleri hiç almayalım?
  haber_yasi_saat: 24

  # Yayınlarken: bir haber kaç saat sonra "artık bayat" sayılsın?
  # Onay vermediğin haber elenmiyor, havuzda kalıp yeni haberlerle
  # yarışmaya devam ediyor. Ama 48 saatlik bir haberi paylaşmak
  # hesabın itibarına zarar verir, o yüzden bir üst sınır lazım.
  yayin_yasi_siniri_saat: 48

  # --- SON DAKİKA (gün içi tekil postlar) ---
  # Akşam turu günün 10 haberini toplu veriyor; son dakika tek haberi
  # çıktığı anda veriyor (2 slayt: haber + ayrıntı).
  #
  # Eşik 8: "önemli, çoğu insan bilmek ister" seviyesi. 9 yapılırsa
  # neredeyse hiç tetiklenmez, 7 yapılırsa "son dakika" etiketi değer
  # kaybeder — her önemli haber son dakika değildir.
  son_dakika_puan_esigi: 8

  # Günde en fazla kaç son dakika postu. Akşam turuyla birlikte günde
  # 3 post eder; Instagram için sağlıklı aralık, takipçi yorulmuyor.
  son_dakika_gunluk_azami: 2

  # "SON DAKİKA" ETİKETİ hangi puandan itibaren basılsın.
  # Tetikleme eşiği 8, ama 8 "önemli haber" demek; 9-10 ise
  # olağanüstü olay. İkisine birden "son dakika" demek etiketin
  # değerini düşürüyor — her gün son dakika gören takipçi için
  # o ibare anlamını yitiriyor.
  #
  # Etiket basılmayan postlar yine gün içi tekil post olarak
  # çıkıyor, sadece kırmızı "SON DAKİKA" ibaresi olmuyor.
  son_dakika_etiket_esigi: 9

  # --- GECE (TR 23:00-07:00) ---
  # Gece farklı davranıyor çünkü onaylayacak kimse uyanık değil.
  # Gündüzki 1 saatlik ömür gece anlamsız: 03:00'te hazırlanan post
  # 04:00'te kendiliğinden iptal olurdu.
  #
  # Eşik 9: gece yalnızca "ülke gündemini belirleyen" seviyedeki
  # olaylar (deprem, büyük saldırı). Sebep: gece hazırlanan post
  # sabaha kalıyor, yani 5-8 saatlik bir haber oluyor. Bu gecikmeyi
  # ancak gerçekten büyük bir olay hak ediyor.
  gece_puan_esigi: 9

  # Gece hazırlanan post saat kaça kadar onay bekleyebilir (TR).
  gece_onay_biter_saat: 8

  # GECE OTOMATİK YAYIN (17 Ağu 2026)
  # Gece kimse uyanık değil; büyük bir olayda hesabın sabaha kadar
  # sessiz kalması kötü. İnsan onayının yerine DÖRT KATMAN kondu
  # (src/otomatik_onay.py):
  #   1. deterministik denetim (sayı/isim/başlık/suçlama dili)
  #   2. ikinci kaynak teyidi  (başka kaynak da veriyor mu?)
  #   3. LLM çapraz denetim    (anlam kayması — ayrı, bağımsız çağrı)
  #   4. riskli kategori engeli (ölüm/suçlama/savaş otomatik çıkmaz)
  #
  # ŞÜPHEDE REDDET: dördü de geçmek zorunda, biri tereddüt ederse
  # haber sabaha bırakılıp insana soruluyor.
  #
  # false yaparsan gece de insan onayı beklenir (eski davranış).
  gece_otomatik_yayin: true

  # İkinci kaynak teyidi hangi ağırlıktan itibaren GEREKMESİN.
  # TRT Haber ve BBC Türkçe 10, Anadolu Ajansı 9 — kurumsal yayıncı,
  # kendi teyit süreçleri var. Ölçüldü: aynı olayı iki kaynağın aynı
  # şekilde vermesi nadir (136 haberlik havuzda tek eşleşme yok), o
  # yüzden muafiyet olmadan bu katman her şeyi reddediyordu.
  tek_basina_yeterli_agirlik: 9

  # Her çalıştırmada her kaynaktan en fazla kaç haber alalım?
  kaynak_basina_limit: 15

  # Feed indirirken kaç saniye bekleyelim, sonra pes edelim
  istek_zaman_asimi: 15


# =========================================================
#  GEMINI (Adım 2 — metin üretimi)
#  API anahtarı BURADA DEĞİL, .env dosyasında (GEMINI_API_KEY).
# =========================================================
gemini:
  # Denenmiş modeller (14 Ağu 2026):
  #   gemini-3.6-flash  → iyi kalite, ~10 sn, kararlı            [seçili]
  #   gemini-3.5-flash  → benzer kalite, biraz daha kısa cümleler
  #   gemini-3.7-flash  → en yeni AMA gerçek boyutlu isteklerde
  #                       3 denemenin 2'sinde 503 "yoğunluk" verdi.
  #                       Talep yatışırsa denenebilir.
  model: "gemini-3.6-flash"

  # Birincil model 503/429 verirse buna düşer.
  yedek_model: "gemini-3.5-flash"

  # 0 = hep aynı cevap, 1 = daha yaratıcı.
  # Haber metninde yaratıcılık istemiyoruz ama tamamen robotik de olmasın.
  sicaklik: 0.6

  # Bir haber için en fazla kaç kez denensin (503 gibi geçici hatalarda)
  deneme_sayisi: 3

  # Tek bir isteğin zaman aşımı (saniye). Uzun makalelerde 10 sn sürebiliyor.
  zaman_asimi: 90

  # Makale gövdesinden modele en fazla kaç karakter gönderilsin.
  # Daha uzunu hem gereksiz hem kotayı yer.
  azami_makale_uzunlugu: 4000


# =========================================================
#  GÖRSEL (Adım 3)
#
#  DİKKAT — BU KISIM PARA HARCIYOR.
#  Gemini'nin görsel modellerinde ücretsiz kota YOK (limit: 0).
#  Bu yüzden ayrı, faturalı bir projeye ait ayrı anahtar kullanıyoruz:
#      GEMINI_API_KEY        -> metin   (faturasız proje, bedava)
#      GEMINI_IMAGE_API_KEY  -> görsel  (faturalı proje)
#  Faturalandırma proje bazında; anahtarlar farklı projelerden olmalı.
# =========================================================
gorsel:
  # Denendi (14 Ağu 2026): 2.5-flash sade ve yazı altında daha okunaklı
  # çıktı, 3.1-flash daha gösterişli ama kalabalık. Ucuz olan işimize
  # daha uygun — pahalıya geçmek kaliteyi artırmıyor.
  #   gemini-2.5-flash-image   ~$0.039  [seçili]
  #   gemini-3.1-flash-image   ~$0.067
  #   gemini-3-pro-image       ~$0.134
  model: "gemini-2.5-flash-image"

  # --- CAROUSEL YAPISI ---
  # Instagram bir postta EN FAZLA 10 görsele izin veriyor. Bu sınır
  # Instagram'ın, bizim değil.
  #
  # KAPAK DENENDİ VE ELENDİ (15 Ağu 2026): kapak + 9 haber düzeni
  # üretildi, örnekleri görüldü. Kapak bir slaytı yiyordu ve karşılığında
  # yalnızca "günün özeti" kimliği veriyordu. Kullanıcı 10 haberi tercih
  # etti. `kapak_ciz` / `kapak_uret` kodu make_image.py'de DURUYOR —
  # fikir değişirse kapak_var'ı true yapmak yeterli, yeniden yazma.
  slayt_sayisi: 10
  # kapak_var ayarı KALDIRILDI — kapak elendi ve kod bu ayarı okumuyordu.
  # Kapak kodu (kapak_ciz/kapak_uret) make_image.py'de duruyor ve şu an
  # yalnızca STORY için kullanılıyor. Carousel'e kapak dönerse
  # hazirla.py'de açıkça çağrılması gerekir.

  # --- MALİYETİ NEREDE HARCIYORUZ ---
  # AI görsel başına ~$0.039. 10 slaytın hepsini AI yapmak günde $0.39,
  # ayda ~$11.7 ederdi. Bunun yerine slaytlar 3 bedava katmandan geliyor:
  #   1. Commons  — haberde tanınan kişi/kurum varsa (bedava)
  #   2. Pexels   — yoksa temsili fotoğraf (bedava)
  #   3. gradyan  — ikisi de bulamazsa (bedava)
  #
  # Yani NORMAL BİR GÜNDE AI HİÇ ÇAĞRILMIYOR, aylık görsel maliyeti $0.
  # AI yalnızca sen Telegram'dan "🎨 Görseli AI ile üret" butonuna
  # basarsan devreye giriyor — maliyet ancak o zaman doğuyor.
  # haberde_ai'yi true yaparsan her slayt AI olur; bilerek yap.
  kapakta_ai: false
  haberde_ai: false

  # MALİYET EMNİYETİ — günde en fazla kaç AI görseli üretilebilir.
  # Normalde 0 kullanılıyor; bu pay tamamen Telegram'daki elle yeniden
  # üretme butonu için. Aşılırsa üretim durur, gradyana düşer, post yine
  # çıkar. Amacı fatura kesmek değil, bir döngü hatasının gece boyunca
  # binlerce istek atmasını engellemek.
  gunluk_azami: 4

  # Instagram carousel'de TÜM slaytlar aynı en-boy oranında olmalı.
  # 4:5 dikey seçtik: karaya göre akışta daha çok yer kaplıyor.
  genislik: 1080
  yukseklik: 1350
  kenar_bosluk: 80         # yazının kenarlardan uzaklığı (piksel)

  # GÜVENLİ ALAN — dikey kenarlarda fazladan pay.
  # Instagram feed'de 4:5 görsel tam görünüyor, sorun yok. Risk profil
  # ızgarasında: eskiden 4:5 postlar kareye kırpılıyordu ve 1080x1350'de
  # bu üstten/alttan 135'er piksel demek. Instagram ızgarayı 2025'te
  # dikey yaptı, yani bugün kırpılmıyor — ama bayrak (y=80) ve kaynak
  # satırı (y=1236) tam o sınırın üstündeydi, hiç payımız yoktu.
  # 150 diyerek ikisini de kırpma çizgisinin içine aldık; başlık ve özet
  # zaten merkezde olduğu için onlar en baştan güvendeydi.
  dikey_guvenli_pay: 150
  # Alt bilgideki sosyal kanal ikonlarının boyu (piksel)
  # 26'da alt bilgide gözden kaçıyordu (kullanıcı fark etmedi).
  # 26/34/42 karşılaştırıldı; 34 fark ediliyor ama kaynak adını ezmiyor.
  kanal_ikon_boyu: 34

  # Metin şeridinin rengi. Fotoğraf yukarıda net kalıp aşağı doğru bu
  # renge dönüşüyor; yazının oturduğu bölge TAM OPAK oluyor.
  #
  # Eskiden perde yarı saydam siyahtı ve fotoğrafın deseni yazının
  # arkasından görünüyordu — açık ya da kalabalık bir fotoğrafta başlık
  # okunmuyordu. Düz renk şerit okunabilirliği fotoğraftan bağımsız
  # kılıyor ve hesaba tutarlı bir kimlik veriyor.
  #
  # Kategorisi listede olmayan haberlerde bu renk kullanılıyor.
  perde_rengi: [22, 18, 46]

  # ŞERİT RENGİ KATEGORİYE GÖRE (18 Ağu 2026)
  #
  # Renk, konuyu başlık okunmadan sezdiriyor: spor yeşil, ekonomi bronz,
  # kültür şarap. Carousel kaydırılırken de tekdüzeliği kırıyor.
  #
  # ⚠️ HEPSİ KOYU OLMAK ZORUNDA. Şerit tam opak ve üstüne BEYAZ yazı
  # basılıyor; açık bir ton seçilirse başlık okunmaz hale gelir.
  # Doygunluk da ölçülü: parlak renkler haber hesabını amatör gösteriyor.
  serit_renkleri:
    turkiye:   [22, 18, 46]     # koyu lacivert — ana kimlik
    dunya:     [30, 20, 52]     # indigo
    spor:      [12, 40, 30]     # koyu çim yeşili
    ekonomi:   [44, 32, 16]     # koyu bronz
    bilim:     [12, 34, 46]     # koyu petrol
    teknoloji: [20, 22, 56]     # koyu mavi-mor
    kultur:    [46, 18, 38]     # koyu şarap
    yasam:     [16, 40, 44]     # koyu turkuaz

  # ⚠️ HABER SİTESİNİN KENDİ GÖRSELİ (og:image) — TELİF RİSKİ TAŞIYOR.
  # Bu görseller çoğu zaman ajans fotoğrafı (AA, Reuters, AFP) ve telifi
  # ajansa ait; "kaynak belirtmek" izin yerine GEÇMEZ. Instagram telif
  # şikayetinde postu kaldırır, tekrarı hesabı riske atar.
  # Kullanıcı bu riski bilerek kullanmayı seçti (18 Ağu 2026) — sektörde
  # yaygın pratik ve görsel gücü Commons/Pexels'ten çok daha yüksek.
  # false yapılırsa eski davranışa dönülür: Commons -> Pexels -> gradyan.
  haber_gorseli_kullan: true

  # og:image bazen sitenin logosu ya da paylaşım rozeti oluyor; bu
  # genişliğin altındakiler eleniyor, yoksa büyütülünce bulanık çıkıyor.
  haber_gorseli_asgari_genislik: 600
  jpeg_kalite: 90          # Instagram PNG kabul etmiyor, JPEG şart
  deneme_sayisi: 3
  zaman_asimi: 180         # görsel üretimi metinden yavaş


# =========================================================
#  IMGBB (Adım 4a — görsel barındırma)
#  Anahtar .env'de: IMGBB_API_KEY
#
#  Neden var: Instagram görseli dosya olarak kabul etmiyor, herkese
#  açık bir URL istiyor. Sunucumuz olmadığı için imgbb ara depo.
# =========================================================
imgbb:
  # Yüklenen görsel kaç saniye sonra kendiliğinden silinsin?
  # Instagram yayında kendi kopyasını aldığı için kısa tutmak güvenli.
  # 172800 = 2 gün. Onay gecikse bile (akşam hazırla, gece onayla)
  # rahatça yeter, ama imgbb hesabı çöp doldurmaz.
  omur_saniye: 172800

  deneme_sayisi: 3
  zaman_asimi: 120        # 10 görsel yükleneceği için cömert davrandık


# =========================================================
#  INSTAGRAM (Adım 4)
#  Anahtarlar .env'de: IG_USER_ID, IG_ACCESS_TOKEN,
#                      META_APP_ID, META_APP_SECRET
# =========================================================
instagram:
  # HANGİ HESABA POST ATILACAK — bunu boş bırakma.
  #
  # Jetonun birden fazla sayfaya erişimi var (DailyBrief, Animarch Studio,
  # Edm Yapı). Kod "ilk bulduğu" hesaba yazarsa yanlış hesaba post gider —
  # ilk denemede tam olarak bu oldu, emlak hesabını seçmişti.
  # O yüzden hedef hesap adı burada AÇIKÇA yazılı ve kod eşleşme
  # bulamazsa çalışmayı reddediyor.
  hesap_kullanici_adi: "dailybrief.co"

  # Graph API sürümü. Meta yaklaşık 2 yıl geriye dönük destek veriyor,
  # ama sürüm eskidikçe uç noktalar kapanabiliyor. Kırılırsa burayı
  # güncelle — kodda sürüm gömülü değil.
  api_surumu: "v23.0"

  # Container hazır olana kadar bekleme (carousel'de her görsel için
  # ayrı container oluşuyor, hepsinin işlenmesi zaman alıyor)
  hazir_bekleme_saniye: 5
  hazir_azami_deneme: 12

  zaman_asimi: 60


# =========================================================
#  HABER KAYNAKLARI
#  aktif: false yaparsan o kaynak atlanır (silmene gerek yok)
#  agirlik: haber seçerken önceliği belirler (yüksek = önce)
# =========================================================
kaynaklar:

  # ---------- TÜRKİYE GÜNDEMİ (ana odak) ----------
  - ad: "TRT Haber"
    url: "https://www.trthaber.com/sondakika.rss"
    kategori: "turkiye"
    agirlik: 10
    aktif: true

  - ad: "BBC Türkçe"
    url: "https://feeds.bbci.co.uk/turkce/rss.xml"
    kategori: "turkiye"
    agirlik: 10
    aktif: true

  - ad: "Anadolu Ajansı"
    url: "https://www.aa.com.tr/tr/rss/default?cat=guncel"
    kategori: "turkiye"
    agirlik: 9
    aktif: true

  - ad: "NTV Gündem"
    url: "https://www.ntv.com.tr/gundem.rss"
    kategori: "turkiye"
    agirlik: 8
    aktif: true

  - ad: "Habertürk Gündem"
    url: "https://www.haberturk.com/rss/kategori/gundem.xml"
    kategori: "turkiye"
    agirlik: 7
    aktif: true

  - ad: "Sözcü Gündem"
    url: "https://www.sozcu.com.tr/feeds-rss-category-gundem"
    kategori: "turkiye"
    agirlik: 6
    aktif: true

  # ---------- DÜNYA GÜNDEMİ (sadece kritik olaylar) ----------
  - ad: "BBC World"
    url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    kategori: "dunya"
    agirlik: 5
    aktif: true

  - ad: "Al Jazeera"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
    kategori: "dunya"
    agirlik: 4
    aktif: true

  # ---------- ÇEŞİTLİLİK KAYNAKLARI (18 Ağu 2026) ----------
  # Neden eklendi: 8 kaynağın 6'sı Türkiye gündemiydi ve turlar
  # siyaset/savaş ağırlıklı çıkıyordu — 16 Ağu turunda 10 haberin 6'sı
  # İsrail/Gazze idi. Bilim, teknoloji, spor, kültür ve ekonomi kaynağı
  # HİÇ yoktu; o konular seçime giremiyordu bile.
  #
  # MAGAZİN/ÜNLÜ HABERİ BİLEREK YOK: ilgi çekiyor ama doğruluk riski
  # yüksek ve dört katmanlı denetim dedikoduyu ayıklayamıyor.
  #
  # Hepsi kendi RSS okuyucumuzla test edildi: 8/8 çalıştı, tarihler dolu.
  - ad: "AA Bilim-Teknoloji"
    url: "https://www.aa.com.tr/tr/rss/default?cat=bilim-teknoloji"
    kategori: "bilim"
    agirlik: 9
    aktif: true

  - ad: "AA Ekonomi"
    url: "https://www.aa.com.tr/tr/rss/default?cat=ekonomi"
    kategori: "ekonomi"
    agirlik: 9
    aktif: true

  - ad: "AA Kültür"
    url: "https://www.aa.com.tr/tr/rss/default?cat=kultur"
    kategori: "kultur"
    agirlik: 8
    aktif: true

  - ad: "AA Spor"
    url: "https://www.aa.com.tr/tr/rss/default?cat=spor"
    kategori: "spor"
    agirlik: 8
    aktif: true

  - ad: "NTV Teknoloji"

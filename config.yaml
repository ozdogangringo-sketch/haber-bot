# ----------------------------------------------------------------------
# İÇERİK FİLTRESİ — Instagram erişim kısıtlamasına karşı
# ----------------------------------------------------------------------
# Instagram bazı kelimeleri içeren postların erişimini sessizce düşürüyor
# ("shadowban"): uyarı gelmez, sadece kimse görmez. Kelimenin ortasına
# yıldız koymak bunu aşıyor ("intihar" -> "int*har").
#
# LİSTE BİLEREK KISA. Aşırı sansürün bedeli var: bir haber hesabında
# "c*nayet" yazmak amatör duruyor ve Instagram haber değeri taşıyan
# içeriğe zaten istisna tanıyor. Bu yüzden ölüm, kaza, saldırı, cinayet
# gibi GÜNDELİK HABER kelimeleri listede YOK. Buraya kelime eklemek
# serbest ama her ekleme okunabilirlikten götürüyor.
icerik_filtresi:
  aktif: true

  # Caption ve hashtag'lerde uygulanır. Slayt görselindeki başlığa
  # varsayılan olarak DOKUNULMUYOR: Instagram görsel içi metni caption
  # kadar agresif taramıyor, ama yıldızlı başlık slaytta çok göze batıyor.
  captionda: true

  # ⚠️ KARAR DEĞİŞTİ (21 Ağu 2026): slayt görselindeki başlığa da
  # uygulanıyor. Önce "yıldızlı başlık slaytta göze batıyor" diye
  # kapatılmıştı; kullanıcı benzer hesapların (mhahaber) görselin
  # ÜSTÜNDE sansürlediğini gösterip aynısını istedi — Instagram
  # erişimi için yaygın bir uygulama.
  gorselde: true

  # ----------------------------------------------------------------
  # BAŞLIK ELEMESİ — SEO çöpü havuza hiç girmesin
  # ----------------------------------------------------------------
  # RSS GİRİŞİNDE uygulanıyor (`fetch_news.haberleri_cek`), seçimde
  # değil: öneri akışı 8 saatlik pencerede ~600 haberden 24'ünü
  # Gemini'ye puanlatıyor ve o 24'ü kategori katmanlı seçim belirliyor.
  # Seçimde elemek GEÇ KALIR, slot zaten dolmuş olur.
  #
  # ⚠️ ÖLÇÜLDÜ (18 Eyl 2026): `yasam` kategorisinin en iyi iki haberi
  # "Rüyada yılan öldürmek ne anlama gelir?" ve "Rüyada köpek
  # saldırısı görmek ne anlama gelir?" idi — Habertürk Yaşam
  # beslemesinin %73'ü rüya tabiri. 24 slotun 2'si kalıcı işgal
  # altındaydı.
  #
  # ⚠️ YENİ DESEN EKLERKEN ÖLÇ. Ölçüt: YAYINLANMIŞ bir haberi eleyen
  # desen yanlış pozitiftir. Aşağıdaki üçü 3393 kayıtta 43 eşleşme
  # veriyor ve yanlış pozitifi SIFIR. Denenip elenenler:
  #   "sorgulama ekranı" -> yayınlanmış KYK haberini eliyordu
  #   "nasıl yapılır"    -> yayınlanmış TÜBİTAK alım haberini eliyordu
  #   "ne anlama gel"    -> ek fayda yok (hepsi ^rüyada ile örtüşüyor),
  #                         meşru açıklayıcı haberi eleme riski var
  baslik_elemeleri:
    # Rüya tabiri — Habertürk Yaşam beslemesinin %73'ü
    - '^r[uü]yada\b'
    # Şans oyunu sonuçları — CNN Türk ve NTV beslemelerinde
    # ⚠️ "on numara" ve "çılgın" 18 Eyl'de eklendi: ilk desen NTV'nin
    # "On Numara sonuçları sorgulama 2026" haberini kaçırıyordu.
    - '\b(say[iı]sal|s[uü]per|[sş]ans|on numara|[cç][iı]lg[iı]n) loto\b|on numara sonu[cç]|loto sonu[cç]|[cç]eki[lı]i[sş] sonu[cç]|sonu[cç] linki|milli piyango|kazand[iı]ran numaralar'
    # ⚠️ SPONSORLU İÇERİK — haber değil, ödenmiş tanıtım.
    # Desen BİLEREK DAR: "reklam" kelimesini tek başına aramak
    # REKLAM HAKKINDAKİ HABERİ eliyordu ("ChatGPT Türkiye'de reklam
    # göstermeye başladı" meşru bir teknoloji haberi). Yalnızca
    # yayıncının kendi koyduğu ETİKET aranıyor.
    - '\[\s*sponsorlu|\(\s*sponsorlu|sponsorlu i[cç]erik|advertorial|i[sş] birli[gğ]iyle haz[iı]rlan'
    # ⚠️ KAYNAĞIN KENDİ ÜRÜN REKLAMI. Investing beslemesi kendi abonelik
    # kampanyasını haber gibi yayınlıyor ("InvestingPro'da %55 indirim
    # için son saatler"). Bunlar "fayda" anahtar kelimelerinin
    # TAMAMINI taşıyor (indirim, son saatler, fırsat) — yani
    # paylaşılabilirlik sinyali eklenirken ilk öne çıkacak şeyler
    # bunlar olurdu. 3 eşleşme, 0 yanlış pozitif.
    - 'investingpro|aboneli[gğ]inizi|\b%\s?\d+ indirim(?:le)? .{0,20}(kilitle|abone|[uü]ye)|son saatler.{0,24}indirim'
    # Market aktüel ürün katalogları — Ekonomim beslemesinde
    - 'akt[uü]el [uü]r[uü]n|bug[uü]n hangi [uü]r[uü]nler|katalo[gğ]u'
    # ⚠️ KANIT SEVİYESİ DAHA ZAYIF — bu desen GEÇMİŞ VERİYLE ölçülemedi,
    # çünkü Ekonomim 18 Eyl'de eklendi ve veritabanında hiç kaydı yok.
    # Bunun yerine 5 canlı ekonomi beslemesinde sınandı: 145 haberde
    # 2 eşleşme, ikisi de hedef (BİM katalog reklamı), diğer 4 kaynakta
    # 0 eşleşme. Yine de yanlış pozitif riski diğer üçünden YÜKSEK.
    # ⚠️ BİRKAÇ GÜN SONRA DOĞRULA: yayınlanmış bir haberi eliyor mu?
    #     select baslik_orj from haberler where durum='yayinlandi'
    #       and baslik_orj regexp '<bu desen>';
    - '\b(b[iİ]m|a101|[sş]ok market|migros|carrefour)\b.{0,45}(indirim|f[iı]yat|[uü]r[uü]n|katalog|akt[uü]el|geliyor)'

  # Kelime KÖKÜ yazılır; ekli hâlleri de yakalanır ("intihar" -> "intiharı").
  # ⚠️ KISA KÖK YAZMA — yanlış eşleşme yapar. Ölçüldü (21 Ağu 2026):
  #     "vur" -> v*rgu, v*rgun
  #     "öl"  -> ö*çüm, ö*çek
  #     "kan" -> k*nser, k*nun, k*nıt
  # Aşağıdaki 16 kökün tamamı "Ölçüm sonucu kanser taraması kanunla
  # kanıtlandı, vurgu yapıldı" cümlesinde HİÇBİR yanlış eşleşme
  # yapmıyor; yeni kelime eklerken aynı testi yap.
  yumusatilacak:
    # Ölüm/şiddet (Aşırı sansürden kaçınıldı — vurdu/vuruldu gibi standart haber fiilleri çıkarıldı)
    - öldür
    - öldü
    - ölüm
    - ölü
    - cinayet
    - katlet
    - bıçakla
    - kurşun
    - silahla
    - infaz
    - idam
    - ceset
    # Önceden var olanlar
    - intihar
    - tecavüz
    - porno
    - fuhuş
    - uyuşturucu
    - kokain
    - eroin
    - esrar
    - taciz
    - istismar
    - işkence
    - katliam
    - terör

  # Etiketlerde yıldızlama işe yaramaz (kimse "#int*har" aramıyor),
  # bu yüzden riskli etiketler tamamen ATILIR.
  yasakli_hashtagler:
    - intihar
    - tecavuz
    - porno
    - fuhus
    - uyusturucu
    - teror
    - katliam
    - istismar
    - taciz

# ----------------------------------------------------------------------
#  PİYASA BÜLTENİ (hafta içi 10:20 ve 18:20 TR)
# ----------------------------------------------------------------------
piyasa:
  # Bültenin sonuna kaç ekonomi HABERİ slaytı eklensin? 0 = kapalı.
  #
  # ⚠️ KULLANICI İSTEĞİ (18 Eyl 2026): "ekonomi turlarımıza en az 2-3
  # tane ekonomi haberi eklersek hem boşa da gitmemiş olur." Bülten
  # önce iki VERİ slaytıydı (ısı haritası + 30 varlık karnesi) ve
  # günde 342 haberlik ekonomi havuzu hiç kullanılmıyordu.
  #
  # ⚠️ GEMINI MALİYETİ: metni hazır olmayan her haber için 1 istek.
  # Ölçüldü — bülten saatinde ekonomi havuzunda 342 haber var ama
  # metni hazır olan yalnızca 5, yani pratikte her slayt bir istek
  # demek: günde en fazla 2 x 3 = 6 istek. Ücretsiz kota günde 40
  # (iki model), mevcut kullanım ~33. Kotayı zorlarsa bu sayıyı
  # düşür; 0 yaparsan bülten eski iki slaytlık hâline döner.
  haber_slayti_adedi: 6

  # Haber kaç saatten taze olmalı. Bülten günde 2 kez çıktığı için
  # 12 saat iki bülten arasını kapsıyor: sabah bülteni gecenin,
  # akşam bülteni gündüzün haberlerini alıyor.
  haber_tazelik_saat: 12

# ----------------------------------------------------------------------
# SOSYAL KANALLAR
# ----------------------------------------------------------------------
# Slaytların alt bilgisinde küçük ikonlar olarak gösteriliyor:
# "bu içerik şu kanallarda da var" demek için.
#
# İkonlar resmi logoların birebir kopyası DEĞİL, kodla çizilen
# tanınabilir sadeleştirmeler (src/make_image.py). Sebep: resmi logolar
# SVG ve Pillow SVG okumuyor; dönüştürmek GitHub runner'da riskli bir
# sistem bağımlılığı gerektiriyor.
#
# Listeden çıkarmak yeterli — kanal kapanırsa ikonu da kaybolur.
sosyal:
  # Instagram'a yayınlanan içerik Facebook sayfasına da gitsin mi?
  # Aynı sayfa jetonu kullanılıyor (pages_manage_posts izniyle), ek
  # anahtar veya yenileme döngüsü yok. Carousel Facebook'ta ALBÜM
  # olarak paylaşılıyor.
  #
  # İKİNCİL KANAL: Facebook paylaşımı patlarsa Instagram postu yayında
  # kalıyor, yalnızca Telegram sonucuna not düşülüyor.
  facebooka_da_at: true

  # Facebook Reels (9:16 video) de paylaşılsın mı?
  # facebooka_da_at açıkken ve video üretilmişse Facebook Sayfasına Reels olarak da yüklenir.
  facebook_reelse_de_at: true

  # Threads'e de paylaşılsın mı?
  # ⚠️ AYRI JETON: Instagram/Facebook jetonu Threads'te ÇALIŞMIYOR.
  # graph.threads.net kendi API'si ve kendi yetkilendirmesi var.
  # .env'de THREADS_ACCESS_TOKEN + THREADS_USER_ID gerekiyor.
  # Anahtar yoksa paylaşım sessizce atlanıyor, tur düşmüyor.
  threadse_de_at: true

  # X (Twitter) API v2 üzerinden de paylaşılsın mı?
  # ⚠️ .env'de TWITTER_API_KEY, TWITTER_API_SECRET, TWITTER_ACCESS_TOKEN,
  # TWITTER_ACCESS_TOKEN_SECRET anahtarları tanımlı olmalıdır.
  twittera_da_at: true

  # YouTube Shorts (Data API v3) üzerinden video paylaşılsın mı?
  # ⚠️ .env'de YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET, YOUTUBE_REFRESH_TOKEN gerekiyor.
  youtube_a_da_at: true

  # Video açıklamasındaki 5. etiket — "etkileşim etiketi".
  #
  # ⚠️ NEDEN VİDEO AYRI: video platformları açıklamadaki YALNIZCA İLK 5
  # etiketi sayıyor, sonrakiler düz metin olarak basılıyor (4 Eyl 2026,
  # kullanıcı Reels'te fark etti). Carousel caption'ı 30 etiket taşıyor
  # ve sabit/jenerik olanlar başta duruyor — o sıralama carousel için
  # DOĞRU (kırpma sondan olsun diye) ama videoda haberin kendi
  # etiketlerini tamamen dışarıda bırakıyordu. Ölçüldü: dört gerçek
  # yayında da ilk 5 aynıydı; 'derbi', 'gemikazasi', 'organnakli' hiç
  # sayılmadı ve ABD'deki tıp haberine '#türkiye' basıldı.
  #
  # Video artık 4 habere özel + 1 etkileşim etiketi alıyor.
  #
  # ⚠️ PLATFORMA GÖRE FARKLI: tek etiket üç yerde aynı işi görmüyor.
  # '#Shorts' YouTube'da gerçek bir format/dağıtım sinyali, Instagram'da
  # hiçbir anlamı yok.
  # ⚠️ HİÇBİRİ ÖLÇÜLMEDİ — bunlar inanç, veri değil. Değiştirmek serbest;
  # tek doğru yol bir süre çalıştırıp erişimi karşılaştırmak.
  etkilesim_etiketleri:
    youtube: Shorts
    reels: keşfet
    tiktok: keşfet
    instagram: keşfet
    facebook_reels: Reels

  # TikTok Content Posting API v2 üzerinden video paylaşılsın mı?
  # ⚠️ .env'de TIKTOK_ACCESS_TOKEN gerekiyor.
  tiktoka_da_at: true

  # Slaytların alt bilgisinde gösterilen kanal ikonları
  kanallar:
    - instagram
    - threads
    - facebook
    - x
    - youtube
    - tiktok

# ---------------------------------------------------------
# SESLENDİRME (ElevenLabs) — "🎙️ Sesli Yayınla" (2026-09-26, postedm'den)
# ---------------------------------------------------------
# Düz "✅ Yayınla" eskisi gibi seslendirmesiz. "🎙️ Sesli Yayınla" → fon müzikli /
# fon müziksiz; seslendirme yalnızca video kanallarına (Reels, TikTok, Shorts,
# FB Reels) uygulanır. Anahtar GitHub secret'ı: ELEVENLABS_API_KEY. Ses ve ayarlar
# kullanıcının postedm'de dinleyip seçtikleriyle aynı.
seslendirme:
  ses_id: "J17lijyP1BHYcM7ld0Rg"        # Adam — tok, vakur Türkçe İstanbul spiker (EzanPlusBot sesi)
  yedek_ses_id: "r3deco0KTo6o0Kb5inro"  # Sıla Özalp — haber sunucusu (yedek ses)
  model: "eleven_multilingual_v2"
  ayarlar:                              # Tok, net ve akıcı haber spikeri ayarı (Adam)
    stability: 0.55
    similarity_boost: 0.75
    style: 0.0
    use_speaker_boost: true
    speed: 1.18
  hedef_lufs: -14
  # Tek haberli postta (son dakika) her zaman kapak: başlık + özet.
  # Turda (birden çok haber) — kullanıcı kararı 2026-09-26: "sadece başlıkları okunsun".
  #   basliklar: her slayt YALNIZCA kendi haberinin başlığını okur
  #   kapak: yalnızca ilk slayt, başlık + özet (kalan haberler sessiz)
  tur_kipi: "basliklar"
  # Son slaytta; önce gerekçe sonra çağrı. "Beğenin" bilerek yok.
  kapanis_cagrisi: "Gündemi kaçırmak istemiyorsanız takipte kalın."

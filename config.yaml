# =========================================================
#  Haber Botu Ayarları
#  Burada API key YOK. Key'ler .env dosyasında durur.
#  Bu dosyayı rahatça git'e commit edebilirsin.
# =========================================================

genel:
  # NOT: zaman dilimi ayarı YOK. Türkiye UTC+3 ve yaz saati uygulaması
  # kaldırıldı, yani fark yıl boyunca sabit. Kod bunu doğrudan
  # kullanıyor (son_dakika._tr_saat). Kütüphaneye bağımlılık eklemenin
  # anlamı yok — DST olsaydı gerekirdi.

  # RSS'ten çekerken: kaç saatten eski haberleri hiç almayalım?
  haber_yasi_saat: 24

  # Yayınlarken: bir haber kaç saat sonra "artık bayat" sayılsın?
  # Onay vermediğin haber elenmiyor, havuzda kalıp yeni haberlerle
  # yarışmaya devam ediyor. Ama 48 saatlik bir haberi paylaşmak
  # hesabın itibarına zarar verir, o yüzden bir üst sınır lazım.
  # ⚠️ 48'DEN 36'YA ÇEKİLDİ (20 Ağu 2026, kullanıcı isteği):
  # "36 saatten eski haber atmayalım hiçbir zaman".
  # Ölçüldü: havuzdaki metni hazır 126 haberin hepsi zaten 36 saatten
  # yeniydi, yani değişiklik anlık kayıp yaratmadı — ama havuz
  # daraldığında turu eski haberle doldurmayı engelliyor.
  # Bu değeri `aday.Baglam` TUR bağlamında tazelik sınırı olarak
  # kullanıyor; tekil postun kendi penceresi ayrı
  # (`son_dakika_tazelik_saat`).
  # Tur önce BAŞLIK LİSTESİ olarak sunulsun mu?
  #
  # true: haberler seçilir, başlıkları Telegram'a gönderilir, kullanıcı
  #       onaylayınca slaytlar üretilir. Kullanıcı isteği (20 Ağu 2026):
  #       "akşam turlarının da önce başlıklarını ver, okeylersem
  #       görselleri üretilsin".
  # false: eski davranış — slaytlar hemen üretilir.
  #
  # Kazanç: görsel üretimi + imgbb yüklemesi turun en uzun adımı
  # (~60 sn). Beğenilmeyecek bir liste için harcanmıyor.
  basliklari_once_sor: true

  # Turdan atlanan haber kaç saat boyunca yeniden aday olmasın?
  # Skor cezası (secim.ERTELEME_CEZASI) dar havuzda yetmiyordu;
  # atlanan haberlerin yarısı bir sonraki turda geri geliyordu.
  atlanan_bekleme_saat: 12

  # Yayınlanmamış haberler kaç gün saklansın? Günlük raporda
  # temizleniyor. ⚠️ YAYINLANMIŞ haberler bundan MUAF — mükerrer
  # engeli onlara bakıyor.
  # Kullanıcı isteği: Havuzda 3 günden eski haber tutulmaz.
  kayit_saklama_gun: 3

  yayin_yasi_siniri_saat: 36

  # --- SON DAKİKA (gün içi tekil postlar) ---
  # Akşam turu günün 10 haberini toplu veriyor; son dakika tek haberi
  # çıktığı anda veriyor (2 slayt: haber + ayrıntı).
  #
  # Eşik 8: "önemli, çoğu insan bilmek ister" seviyesi. 9 yapılırsa
  # neredeyse hiç tetiklenmez, 7 yapılırsa "son dakika" etiketi değer
  # kaybeder — her önemli haber son dakika değildir.
  son_dakika_puan_esigi: 8

  # ⚠️ SON DAKİKA KONTROLÜ VE GÜN İÇİ ÖNERİLER İÇİN ASGARİ AĞIRLIK.
  # 6: Kaliteli teknoloji, ekonomi, spor, kültür ve gündem kaynaklarının tamamı
  # gün içi 5'li öneri havuzuna dahil edilir.
  son_dakika_asgari_agirlik: 6

  # Günde en fazla kaç tekil haber postu yayınlanabilir (saatlik ritme uygun: 18).
  son_dakika_gunluk_azami: 18
  # Tek kategori günü domine etmesin — kategori başına günlük sınır
  son_dakika_kategori_azami: 6
  # Kontrol job'ı aday bulamazsa kaç habere metin üretsin.
  # Tekil post önerisinde kaç başlık TEK Gemini isteğiyle puanlanacak.
  # Bunların en iyi 5'i Telegram'a öneri olarak gidiyor.
  oneri_aday_adedi: 24
  # ⚠️ ÖNERİ EŞİKLERİ, TAM METİN EŞİKLERİNDEN 2 PUAN DÜŞÜK.
  # Sebep ölçüldü (19 Ağu 2026): toplu başlık puanlaması aynı habere
  # tam metin puanlamasından ortalama 1.5-1.8 puan DÜŞÜK veriyor.
  # Model 10 haberi yan yana görünce birbirleriyle kıyaslayıp
  # katılaşıyor ve elinde makale gövdesi değil yalnızca başlık+özet
  # oluyor. Özeti 200'den 800 karaktere çıkarmak sapmayı yalnızca
  # 0.2 puan iyileştirdi — yani sorun bilgi miktarı değil, bağlam.
  # Prompta "her haberi kendi başına değerlendir" notu eklendi, sapma
  # 1.8'den 1.6'ya indi ama tamamen kapanmadı.
  # Bu yüzden öneri aşaması kendi eşiğini kullanıyor. Zaten burada
  # eleme kesin değil: eşiği geçen haber YAYINLANMIYOR, yalnızca
  # kullanıcıya öneriliyor — son sözü insan söylüyor.
  # Gece: toplu puanı bu değerin üstünde olan haber ÖNERİYE düşmez,
  # doğrudan metni üretilip otomatik yayın denetimine sokulur.
  # Toplu puan tam metin puanından ~1.6 düşük geldiği için, yayın
  # eşiği 9 olan bir haber burada 7-8 civarında görünüyor.
  oneri_otomatik_uretim_esigi: 8
  oneri_kategori_esikleri:
    turkiye: 6
    dunya: 6
    ekonomi: 5
    spor: 5
    bilim: 5
    teknoloji: 5
    kultur: 5
    yasam: 5
  # Tekil post adayı bu kadar saatten taze olmalı. 8 saat:
  # sabah düşen kaliteli haberler öğleden sonra da öneri havuzunda değerlendirilir.
  son_dakika_tazelik_saat: 8
  # ⚠️ KATEGORİ BAZLI EŞİK. Tek eşik (8) spor ve ekonomiyi tamamen
  # dışlıyordu: ölçüldü, o kategorilerde 8+ puan alan haber SIFIR,
  # en yükseği 7. Önem puanı kategoriye göre farklı dağılıyor, bu
  # yüzden eşik de kategoriye göre veriliyor. Gece hepsine +1 ekleniyor.
  son_dakika_kategori_esikleri:
    turkiye: 8
    dunya: 8
    ekonomi: 7
    spor: 7
    bilim: 7
    teknoloji: 7
    kultur: 7
    yasam: 7

  # "SON DAKİKA" ETİKETİ hangi puandan itibaren basılsın.
  # Tetikleme eşiği 8, ama 8 "önemli haber" demek; 9-10 ise
  # olağanüstü olay. İkisine birden "son dakika" demek etiketin
  # değerini düşürüyor — her gün son dakika gören takipçi için
  # o ibare anlamını yitiriyor.
  #
  # Etiket basılmayan postlar yine gün içi tekil post olarak
  # çıkıyor, sadece kırmızı "SON DAKİKA" ibaresi olmuyor.
  son_dakika_etiket_esigi: 9

  # ----------------------------------------------------------------
  # PAYLAŞILABİLİRLİK MUAFİYETİ (18 Eyl 2026, kullanıcı isteği)
  # ----------------------------------------------------------------
  # "Sayfanın keşfete düşmesi ve popülaritesinin artması için insanların
  # arkadaşlarına DM'den atacağı ya da kaydedeceği haberlere ihtiyacımız
  # var; bunlar puan olarak zayıf kalıp elenmesin."
  #
  # ⚠️ "ÖNEMLİ" İLE "PAYLAŞILIR" AYNI ŞEY DEĞİL:
  #   "Gazze'de can kaybı 73 bine yükseldi"  önem 9 · paylaşım 3
  #   "KYK başvuruları 5 gün uzatıldı"       önem 6 · paylaşım 9
  # `onem_puani` ikincisini ölçmüyor. Gemini toplu puanlamasına ikinci
  # bir alan eklendi (`paylasim`) — EK MALİYET YOK, zaten yapılan
  # çağrıya alan eklendi.
  #
  # Kural: önem eşiğini geçemeyen haber, paylaşım puanı bu eşiğin
  # üstündeyse YİNE DE aday olabiliyor.
  #
  # ⚠️ TABAN ÖNEM ŞART — yoksa havuz REKLAMA açılır. ÖLÇÜLDÜ (18 Eyl):
  # Investing beslemesi kendi abonelik kampanyasını haber gibi
  # yayınlıyor ("InvestingPro'da %55 indirim için son saatler") ve bu
  # başlık paylaşım kelimelerinin HEPSİNİ taşıyor. Üç katman birden
  # koruyor: prompt "reklama 1 ver" diyor · `baslik_elemeleri` eliyor ·
  # `paylasim_taban_onem` alt sınır koyuyor.
  #
  # ⚠️ ÖLÇÜLDÜ (18 Eyl 2026) — Instagram insights verisi, 245
  # yayınlanmış gönderi, 629 kaydetme, 1306 paylaşım:
  #                    gönderi   kaydetme/gönderi   paylaşım/gönderi
  #   fayda haberi     28 (%11)       9.89               24.11
  #   diğer           217 (%89)       1.62                2.91
  # Gönderilerin %11'i kaydetmenin %44'ünü, paylaşımın %52'sini
  # getiriyor. En çok paylaşılan üç gönderi (KYK yurt sonuçları 288,
  # burs duyurusu 199, KYK 55) toplam paylaşımın %45'i.
  #
  # ⚠️ EŞİK 8 DE ÖLÇÜLEREK SEÇİLDİ. Gerçek başlıklar prompta verildi:
  #   KYK yurt sonuçları (107 kayıt/288 pay)   -> paylaşım 8
  #   500 öğrenciye burs (78/199)              -> paylaşım 9
  #   TÜBİTAK 660 personel (20 pay)            -> paylaşım 8
  #   Prim/vergi yapılandırma (17 pay)         -> paylaşım 9
  #   Gazze can kaybı (0 kayıt)                -> paylaşım 3
  #   InvestingPro reklamı                     -> paylaşım 1  ✓
  #   [Sponsorlu İçerik]                       -> paylaşım 1  ✓
  # Eşik 8 dört fayda haberini de yakalıyor, reklamı ve sert haberi
  # almıyor.
  #
  # 0 yapılırsa muafiyet tamamen kapanır.
  paylasim_esigi: 8
  paylasim_taban_onem: 4

  # Öneri sıralamasında paylaşım puanının ağırlığı.
  # sıralama = onem + agirlik × max(0, paylasim − 5)
  #
  # ⚠️ ÖLÇÜLDÜ (18 Eyl 2026, 245 gönderilik Instagram insights verisi):
  # fayda haberleri gönderilerin %11'i ama kaydetmenin %44'ü ve
  # paylaşımın %52'si. Paylaşımda 8.3 kat, erişimde 3.6 kat fark.
  #
  # 0.5 seçildi çünkü bu bir HABER hesabı — etki en fazla +2.5 ve
  # büyük haber hâlâ üstte kalıyor (ölçüldü: Gazze 8.0 > TÜBİTAK 7.5).
  # 0 yapılırsa sıralama eski davranışa döner.
  paylasim_siralama_agirligi: 0.5

  # --- GECE (TR 23:00-07:00) ---
  # Gece farklı davranıyor çünkü onaylayacak kimse uyanık değil.
  # Gündüzki 1 saatlik ömür gece anlamsız: 03:00'te hazırlanan post
  # 04:00'te kendiliğinden iptal olurdu.
  #
  # Eşik 9: gece yalnızca "ülke gündemini belirleyen" seviyedeki
  # olaylar (deprem, büyük saldırı). Sebep: gece hazırlanan post
  # sabaha kalıyor, yani 5-8 saatlik bir haber oluyor. Bu gecikmeyi
  # ancak gerçekten büyük bir olay hak ediyor.
  gece_puan_esigi: 9

  # GECE OTOMATİK YAYIN (17 Ağu 2026)
  # Gece kimse uyanık değil; büyük bir olayda hesabın sabaha kadar
  # sessiz kalması kötü. İnsan onayının yerine DÖRT KATMAN kondu
  # (src/otomatik_onay.py):
  #   1. deterministik denetim (sayı/isim/başlık/suçlama dili)
  #   2. ikinci kaynak teyidi  (başka kaynak da veriyor mu?)
  #   3. LLM çapraz denetim    (anlam kayması — ayrı, bağımsız çağrı)
  #   4. riskli kategori engeli (ölüm/suçlama/savaş otomatik çıkmaz)
  #
  # ŞÜPHEDE REDDET: dördü de geçmek zorunda, biri tereddüt ederse
  # haber sabaha bırakılıp insana soruluyor.
  #
  # false yaparsan gece de insan onayı beklenir (eski davranış).
  gece_otomatik_yayin: false

  # İkinci kaynak teyidi hangi ağırlıktan itibaren GEREKMESİN.
  # TRT Haber ve BBC Türkçe 10, Anadolu Ajansı 9 — kurumsal yayıncı,
  # kendi teyit süreçleri var. Ölçüldü: aynı olayı iki kaynağın aynı
  # şekilde vermesi nadir (136 haberlik havuzda tek eşleşme yok), o
  # yüzden muafiyet olmadan bu katman her şeyi reddediyordu.
  tek_basina_yeterli_agirlik: 9

  # Her çalıştırmada her kaynaktan en fazla kaç haber alalım?
  kaynak_basina_limit: 15

  # Feed indirirken kaç saniye bekleyelim, sonra pes edelim
  istek_zaman_asimi: 15


# =========================================================
#  GEMINI (Adım 2 — metin üretimi)
#  API anahtarı BURADA DEĞİL, .env dosyasında (GEMINI_API_KEY).
# =========================================================
gemini:
  # Denenmiş modeller (14 Ağu 2026):
  #   gemini-3.6-flash  → iyi kalite, ~10 sn, kararlı            [seçili]
  #   gemini-3.5-flash  → benzer kalite, biraz daha kısa cümleler
  #   gemini-3.7-flash  → en yeni AMA gerçek boyutlu isteklerde
  #                       3 denemenin 2'sinde 503 "yoğunluk" verdi.
  #                       Talep yatışırsa denenebilir.
  model: "gemini-3.6-flash"

  # Birincil model 503/429 verirse buna düşer.
  #
  # ⚠️ KOTA TÜKENMESİ KENDİ KENDİNİ ÇÖZÜYOR, ELLE SIRA DEĞİŞTİRME.
  # 18 Ağu 2026'da 3.6'nın günlük kotası tükendi ve sıra geçici olarak
  # ters çevrilmişti; sonra geri alındı. Sebep: RPD kotaları Pasifik
  # saatiyle gece yarısı (TR ~10:00) sıfırlanıyor, yani sorun kendiliğinden
  # geçiyor. Elle değiştirilen sıra ise KALICI oluyor ve geri alınması
  # unutulunca bot sürekli daha zayıf modelle çalışıyor.
  #
  # Kota dolduğu gün maliyeti: haber başına 3 başarısız deneme (~12 sn).
  # Katlanılır — yanlış kalıcı yapılandırmadan iyidir.
  yedek_model: "gemini-3.5-flash"

  # 0 = hep aynı cevap, 1 = daha yaratıcı.
  # Haber metninde yaratıcılık istemiyoruz ama tamamen robotik de olmasın.
  sicaklik: 0.6

  # Bir haber için en fazla kaç kez denensin (503 gibi geçici hatalarda)
  deneme_sayisi: 3

  # Tek bir isteğin zaman aşımı (saniye). Uzun makalelerde 10 sn sürebiliyor.
  zaman_asimi: 90

  # Makale gövdesinden modele en fazla kaç karakter gönderilsin.
  # Uzun siyasi/kabine konuşmalarındaki tüm maddeleri kapsaması için 12000.
  azami_makale_uzunlugu: 12000


# =========================================================
#  SEÇİM
# =========================================================
secim:
  # ⚠️ TUR SABİT 10 SLAYT DEĞİL. Eşiği geçen kaç haber varsa o kadar
  # slayt üretiliyor: sakin gün 6-7, yoğun gün 10 (Instagram sınırı).
  #
  # Önce havuzdan hep en iyi 10 alınıyordu ve havuz doluyken 10'uncu
  # haber "belediye şu toplantıyı yaptı" seviyesine düşebiliyordu.
  # Zayıf haberle slayt doldurmak turun tamamını sıradanlaştırıyor.
  asgari_onem_puani: 6

  # ⚠️ ÖN ELEMEDE HER KATEGORİYE GARANTİLİ PAY.
  # Ölçüldü (1236 haberlik havuz): pay olmadan 25 adayın 24'ü TRT
  # Haber'den geliyordu, kategori dağılımı %100 "turkiye" idi. Ön skor
  # `ağırlık × 10` ile başladığı için ağırlığı yüksek tek kaynak listeyi
  # dolduruyor; eklenen bilim/spor/ekonomi/kültür kaynakları metin
  # üretimine HİÇ giremiyordu.
  # ⚠️ KATEGORİ KATSAYILARI — haberler önce KENDİ kategorisinde yarışır,
  # sonra bu katsayıyla ağırlıklandırılır. Bir kategoriye tavan ya da
  # kota koymuyor; yalnızca kategoriler arası göreli önceliği belirliyor.
  kategori_katsayilari:
    turkiye: 1.00
    dunya: 0.85
    ekonomi: 0.80
    spor: 0.75
    bilim: 0.75
    teknoloji: 0.70
    kultur: 0.65
    yasam: 0.65
  # Listede olmayan kategori bunu alır
  kategori_varsayilan_katsayi: 0.60
  # Kategori içi her sıra için puan bu oranla azalır (üstel).
  # Küçültmek kategori çeşidini artırır, büyütmek büyük kategorilere
  # daha çok yer verir. 0.88 ölçülerek seçildi.
  kategori_sira_azalmasi: 0.88

  # ⚠️ KAYNAK AĞIRLIĞI ÖNERİ SIRALAMASINA GERİ KONDU (18 Eyl 2026).
  # Öncesinde öneri kapısı `içerik − yaş` diyordu ve `agirlik` HİÇ
  # geçmiyordu: ölçüldü, ağırlığı 6 olan Sözcü Gündem ağırlığı 10 olan
  # TRT Haber'in önünde 2. sıraya çıkıyordu. config'deki `agirlik`
  # alanı seçimde hiçbir işe yaramıyordu.
  #
  # ⚠️ KATSAYI BİLEREK KÜÇÜK — kullanıcı uyarısı (18 Eyl 2026):
  # "ağırlığı sadece kaynağa verince daha taraflı ya da benzer
  # haberler çıkabiliyor". Ölçüm doğruladı; 19 Ağu'da çıplak
  # `agirlik × 10` ile 25 adayın tamamı 2 kategoriden gelmişti.
  #
  # 1.5 ile ağırlık aralığı 6…15 (span 9), içerik sinyali aralığı
  # −10…+20 (span 30). Yani ağırlık sıralamayı BELİRLEMİYOR, eşitliği
  # BOZUYOR. Büyütürsen havuz TRT/AA'ya kilitlenir; 0 yaparsan kaynak
  # güvenilirliği yine yok sayılır.
  agirlik_katsayisi: 1.5

  # ⚠️ KATEGORİ SLOT TAVANI (18 Eyl 2026).
  # Kategori katmanlı seçim çeşitliliği çözdü ama kaliteyi gözetmiyordu:
  # her kategorinin 1. sırası TAM katsayı alıyor, kategori kaç haberlik
  # olursa olsun. ÖLÇÜLDÜ: 5 haberlik `kultur` 2 slot alırken 228
  # haberlik `turkiye` 5 slot alıyordu — turkiye'nin 6. en iyi haberi
  # hiç puanlanmıyordu.
  #
  # Tavan = 1 + havuz/bolen, `tavani` ile sınırlı. Her kategori EN AZ
  # 1 slot alıyor, yani çeşitlilik güvencesi duruyor.
  #   bolen küçültülürse  -> büyük kategoriler daha çok slot alır
  #   tavani küçültülürse -> hiçbir kategori baskın olamaz
  kategori_slot_boleni: 40
  kategori_slot_tavani: 6

  # ⚠️ KAYNAK MUTABAKATI (18 Eyl 2026) — kullanıcı sorusundan doğdu:
  # "Tera Holding ve Katılımevim haberleri neden hiç önerilmedi?"
  #
  # ÖLÇÜLDÜ: ikisi de günün en çok işlenen ekonomi olaylarıydı —
  #   Katılımevim   6 FARKLI KAYNAK, 7 haber (5'i 100 dakika içinde)
  #   Tera Holding  5 FARKLI KAYNAK, 10 haber, 16 saate yayılan olay
  # ve HİÇBİRİ 24 adaya giremedi (kategori içi sıraları 6., 14., 23.,
  # 33., 45., 66., 84.).
  #
  # ⚠️ SİNYAL ORADAYDI, TERS YÖNDE KULLANILIYORDU. Beş yayın
  # kuruluşunun aynı anda aynı olayı vermesi önemin en güçlü BEDAVA
  # kanıtı; sistem ise bunu "mükerrer" sayıp bastırıyordu. Aynı
  # ölçüm CLAUDE.md'de zaten vardı ("rutin haberde 0 ek kaynak, büyük
  # olayda 6-12") ama yalnızca FOTOĞRAF seçiminde kullanılıyordu.
  #
  # ⚠️ ANAHTAR KELİMEYE BAĞLI DEĞİL. Deprem de, şirket iflası da,
  # transfer de aynı şekilde yakalanıyor — `_icerik_puani`nin kelime
  # listesinden bağımsız ilk seçim sinyali.
  #
  # Bonus = puan × (farklı kaynak − 1), tavanla sınırlı.
  #   2 kaynak → +8    4 kaynak → +24
  #   3 kaynak → +16   5+ kaynak → +30 (tavan)
  # Ölçüldü: 722 haberlik pencerede 486'sı tek kaynak, yalnızca 10'u
  # 6 kaynak — yani keskin bir ayırıcı, her şeyi yükseltmiyor.
  # 0 yapılırsa sinyal kapanır.
  mutabakat_kaynak_puani: 8.0
  mutabakat_azami_puan: 30.0

  # İki başlık kaç ortak anahtar kelime paylaşırsa "aynı olay" sayılsın.
  # 2 ölçüldü: "İsrail ... Gazze" ile "İsrail ... Lübnan" ayrışıyor ama
  # aynı olayın iki farklı kaynaktaki hâli birleşiyor.
  #
  # ⚠️ KATEGORİ VE KAYNAK KOTASI YOK (18 Ağu 2026'da kaldırıldı). Gündem
  # gerçekten tek konuya kilitlendiğinde (deprem, seçim gecesi) kota o
  # haberleri dışarıda bırakıp yerlerine önemsizlerini alıyordu.
  konu_ortak_kelime_esigi: 2
  # Son kaç günde yayınlanmış konular tekrar seçilmesin
  gecmis_konu_gun: 2
  # Geçmiş için eşik daha yüksek: devam eden olayı değil,
  # aynı haberin tekrarını engellemek istiyoruz
  gecmis_ortak_kelime_esigi: 3
  # Bu puanın üstündeki haberler tekrar engelinden MUAF: gündüz son
  # dakika olarak paylaşılan büyük bir olay, akşam özetinde de yer alır
  gecmis_muafiyet_puani: 9


# =========================================================
#  GÖRSEL (Adım 3)
#
#  DİKKAT — BU KISIM PARA HARCIYOR.
#  Gemini'nin görsel modellerinde ücretsiz kota YOK (limit: 0).
#  Bu yüzden ayrı, faturalı bir projeye ait ayrı anahtar kullanıyoruz:
#      GEMINI_API_KEY        -> metin   (faturasız proje, bedava)
#      GEMINI_IMAGE_API_KEY  -> görsel  (faturalı proje)
#  Faturalandırma proje bazında; anahtarlar farklı projelerden olmalı.
# =========================================================
gorsel:
  # Denendi (14 Ağu 2026): 2.5-flash sade ve yazı altında daha okunaklı
  # çıktı, 3.1-flash daha gösterişli ama kalabalık. Ucuz olan işimize
  # daha uygun — pahalıya geçmek kaliteyi artırmıyor.
  #   gemini-2.5-flash-image   ~$0.039  [seçili]
  #   gemini-3.1-flash-image   ~$0.067
  #   gemini-3-pro-image       ~$0.134
  model: "gemini-2.5-flash-image"

  # --- CAROUSEL YAPISI ---
  # Instagram bir postta EN FAZLA 10 görsele izin veriyor. Bu sınır
  # Instagram'ın, bizim değil.
  #
  # KAPAK DENENDİ VE ELENDİ (15 Ağu 2026): kapak + 9 haber düzeni
  # üretildi, örnekleri görüldü. Kapak bir slaytı yiyordu ve karşılığında
  # yalnızca "günün özeti" kimliği veriyordu. Kullanıcı 10 haberi tercih
  # etti. `kapak_ciz` / `kapak_uret` kodu make_image.py'de DURUYOR —
  # fikir değişirse kapak_var'ı true yapmak yeterli, yeniden yazma.
  slayt_sayisi: 10
  # kapak_var ayarı KALDIRILDI — kapak elendi ve kod bu ayarı okumuyordu.
  # Kapak kodu (kapak_ciz/kapak_uret) make_image.py'de duruyor ve şu an
  # yalnızca STORY için kullanılıyor. Carousel'e kapak dönerse
  # hazirla.py'de açıkça çağrılması gerekir.

  # --- MALİYETİ NEREDE HARCIYORUZ ---
  # AI görsel başına ~$0.039. 10 slaytın hepsini AI yapmak günde $0.39,
  # ayda ~$11.7 ederdi. Bunun yerine slaytlar 3 bedava katmandan geliyor:
  #   1. Commons  — haberde tanınan kişi/kurum varsa (bedava)
  #   2. Pexels   — yoksa temsili fotoğraf (bedava)
  #   3. gradyan  — ikisi de bulamazsa (bedava)
  #
  # Yani NORMAL BİR GÜNDE AI HİÇ ÇAĞRILMIYOR, aylık görsel maliyeti $0.
  # AI yalnızca sen Telegram'dan "🎨 Görseli AI ile üret" butonuna
  # basarsan devreye giriyor — maliyet ancak o zaman doğuyor.
  # haberde_ai'yi true yaparsan her slayt AI olur; bilerek yap.
  kapakta_ai: false

  # MALİYET EMNİYETİ — günde en fazla kaç AI görseli üretilebilir.
  # Normalde 0 kullanılıyor; bu pay tamamen Telegram'daki elle yeniden
  # üretme butonu için. Aşılırsa üretim durur, gradyana düşer, post yine
  # çıkar. Amacı fatura kesmek değil, bir döngü hatasının gece boyunca
  # binlerce istek atmasını engellemek.
  gunluk_azami: 4

  # Instagram carousel'de TÜM slaytlar aynı en-boy oranında olmalı.
  # 4:5 dikey seçtik: karaya göre akışta daha çok yer kaplıyor.
  genislik: 1080
  yukseklik: 1920
  kenar_bosluk: 80         # yazının kenarlardan uzaklığı (piksel)

  # GÜVENLİ ALAN (9:16 - 1080x1920)
  dikey_guvenli_pay: 330
  # Alt bilgideki sosyal kanal ikonlarının boyu (piksel)
  # 26'da alt bilgide gözden kaçıyordu (kullanıcı fark etmedi).
  # 26/34/42 karşılaştırıldı; 34 fark ediliyor ama kaynak adını ezmiyor.
  kanal_ikon_boyu: 34

  # Metin şeridinin rengi. Fotoğraf yukarıda net kalıp aşağı doğru bu
  # renge dönüşüyor; yazının oturduğu bölge TAM OPAK oluyor.
  #
  # Eskiden perde yarı saydam siyahtı ve fotoğrafın deseni yazının
  # arkasından görünüyordu — açık ya da kalabalık bir fotoğrafta başlık
  # okunmuyordu. Düz renk şerit okunabilirliği fotoğraftan bağımsız
  # kılıyor ve hesaba tutarlı bir kimlik veriyor.
  #
  # Kategorisi listede olmayan haberlerde bu renk kullanılıyor.
  perde_rengi: [22, 18, 46]

  # ŞERİT RENGİ KATEGORİYE GÖRE (18 Ağu 2026)
  #
  # Renk, konuyu başlık okunmadan sezdiriyor: spor yeşil, ekonomi bronz,
  # kültür şarap. Carousel kaydırılırken de tekdüzeliği kırıyor.
  #
  # ⚠️ HEPSİ KOYU OLMAK ZORUNDA. Şerit tam opak ve üstüne BEYAZ yazı
  # basılıyor; açık bir ton seçilirse başlık okunmaz hale gelir.
  # Doygunluk da ölçülü: parlak renkler haber hesabını amatör gösteriyor.
  serit_renkleri:
    turkiye:   [22, 18, 46]     # koyu lacivert — ana kimlik
    dunya:     [30, 20, 52]     # indigo
    spor:      [12, 40, 30]     # koyu çim yeşili
    ekonomi:   [44, 32, 16]     # koyu bronz
    bilim:     [12, 34, 46]     # koyu petrol
    teknoloji: [20, 22, 56]     # koyu mavi-mor
    kultur:    [46, 18, 38]     # koyu şarap
    yasam:     [16, 40, 44]     # koyu turkuaz

  # ⚠️ HABER SİTESİNİN KENDİ GÖRSELİ (og:image) — TELİF RİSKİ TAŞIYOR.
  # Bu görseller çoğu zaman ajans fotoğrafı (AA, Reuters, AFP) ve telifi
  # ajansa ait; "kaynak belirtmek" izin yerine GEÇMEZ. Instagram telif
  # şikayetinde postu kaldırır, tekrarı hesabı riske atar.
  # Kullanıcı bu riski bilerek kullanmayı seçti (18 Ağu 2026) — sektörde
  # yaygın pratik ve görsel gücü Commons/Pexels'ten çok daha yüksek.
  # false yapılırsa eski davranışa dönülür: Commons -> Pexels -> gradyan.
  haber_gorseli_kullan: true

  # ⚠️ İNTERNETTE GÖRSEL ARAMA (DuckDuckGo) — 3 EYLÜL 2026'DA KAPATILDI.
  #
  # 28 Ağu 2026'da `fetch_web_image` eklendi ve zincirin BİRİNCİ sırasına
  # kondu — yani haberin kendi og:image'inin bile ÖNÜNE. Yaptığı iş:
  # başlığın ilk 6 kelimesiyle DuckDuckGo görsel araması yapıp,
  # çözünürlük + netlik testinden geçen İLK fotoğrafı basmak.
  #
  # ⚠️ ALAKA DENETİMİ YOKTU. Test yalnızca piksel ve netlik ölçüyor,
  # fotoğrafın haberi anlatıp anlatmadığını DEĞİL. 3 gerçek haberle
  # ölçüldü (3 Eyl 2026), üçü de yanlış fotoğraf getirdi:
  #   "ABD İran'da Devrim Muhafızları'na saldırdı"
  #      -> a57.foxnews.com'dan Trump portresi (başlığı: "Trump tells
  #         The Atlantic that he runs the country")
  #   "Milli Hızlı Tren 250 km/s hıza ulaştı"
  #      -> 5G ihalesi haberinin görseli
  #   "Akdeniz Oyunları'nda 10 madalya"
  #      -> halter e-ticaret blogundan profil fotoğrafı
  # Üçü de teknik testi GEÇTİ — çünkü test doğru soruyu sormuyor.
  #
  # ⚠️ METİN TABANLI ALAKA KAPISI BU KUSURU ÇÖZMÜYOR. Denendi ve
  # ölçüldü: aday başlığı ile haber başlığının ortak özel isim taşıması
  # şartı kondu, 6 haberin 6'sı da GEÇTİ — Fox News/Trump dahil. Sebep
  # döngüsel: `gorsel_konu` "Donald Trump" olduğu için arama Trump'ı
  # arıyor, dolayısıyla her sonuçta "Trump" geçiyor. Kapı kendi kendini
  # onaylıyor. Bunu ancak GÖRSELİN İÇİNE bakan bir denetim çözebilir
  # (Gemini Vision — ayrı bir iş olarak planlandı).
  #
  # ⚠️ TELİF: `YASAKLI_STOK_SITELERI` listesi YANLIŞ TARAFI engelliyordu.
  # Shutterstock/Getty engelli (sana lisans SATACAK siteler), ama
  # foxnews.com / haber ajansı CDN'leri serbest (sana DMCA GÖNDERECEK
  # olanlar). Yayınlanan 10 web_haber postunun 10'u da ATIFSIZ ve
  # "ARŞİV GÖRSELİ" ibaresi olmadan çıktı.
  #
  # KAPATMANIN BEDELİ ÖLÇÜLDÜ: yayınlanmış 10 web_haber postu tek tek
  # denendi — 4'ü haberin KENDİ fotoğrafını bulurdu (daha iyi: konuya
  # garantili bağlı), 6'sı Pexels'e düşerdi (genel ama dürüst ve
  # hukuken temiz). Yani 10 doğrulanamaz fotoğraf yerine 4 doğru +
  # 6 temsili. Net kazanç.
  #
  # true yapılırsa katman ZİNCİRİN SONUNA çalışır (og:image, Commons ve
  # Pexels'in hepsi başarısız olursa), atıf ZORUNLU basılır ve slayta
  # "ARŞİV GÖRSELİ" ibaresi konur. Yine de doğrulanmamış fotoğraf
  # demektir — Vision denetimi devreye girene kadar açma.
  web_gorsel_ara: false

  # ⚠️ EDİTORYAL KANCA (hook) — 9:16 kapak slaytında fotoğrafın üstüne
  # basılan iri iki satırlık vurgu. `src/hook_motoru.py`.
  #
  # Projedeki her özellik kapatılabiliyor; bunun anahtarı YOKTU.
  # Ölçüldü (9 Eyl 2026, 200 haber): kanca haberlerin yalnızca
  # %18'inde çiziliyor — kalan %82 başlığı tekrarladığı için bilerek
  # bastırılıyor (A kuralı). Yani kapatmanın görünür bedeli zaten
  # küçük, ama beğenilmezse tek satırla kapanmalı.
  kanca_ciz: true

  # ⚠️ VISION DENETİMİ — fotoğrafın İÇİNE bakar (3 Eyl 2026).
  #
  # Bu projedeki bütün doğruluk denetimleri METNE bakıyordu
  # (`dogrula.py`: sayı, isim, alıntı, suçlama dili). Görsel tarafında
  # ölçülen her şey TEKNİKTİ: piksel, netlik, dosya boyutu. Sonuç:
  # "ABD İran'a saldırdı" haberine gelen Fox News/Trump portresi
  # 1200x675, keskin ve temizdi — teknik testin her sorusuna "evet"
  # dedi, kimse "bu fotoğraf bu haberi mi anlatıyor" diye sormadı.
  #
  # ⚠️ METİN TABANLI KAPI DENENDİ VE ELENDİ: aday başlığı ile haber
  # başlığının ortak özel isim taşıması şartı kondu, 6 haberin 6'sı
  # geçti. Döngüsel — `gorsel_konu` "Donald Trump" olduğu için arama
  # Trump'ı arıyor, her sonuçta Trump geçiyor.
  #
  # CANLI ÖLÇÜLDÜ (3 vaka, 3'ü de doğru):
  #   Vlahovic + "Beşiktaş forması"  -> "mor Fiorentina antrenman üstü,
  #                                      ACF Fiorentina logosu" -> RED
  #   Vargas + "milli takım forması" -> "Fenerbahçe forması, 44 numara"
  #                                     -> RED
  #   Hakan Fidan, bağlam yok        -> KABUL
  #
  # MALİYET: çağrı başına ~5.4 sn ve ~600 token. Görsel 512px'e
  # küçültülerek gönderiliyor.
  #
  # ⚠️ YALNIZCA BELİRLİ KİŞİ/KURUM İDDİASI TAŞIYAN KATMANLARDA çalışır
  # (commons, commons_split, web_haber). og:image muaf — yayıncı o
  # fotoğrafı o haber için koymuş. Pexels muaf — temsili olduğunu
  # zaten söylüyor ve ARŞİV ibaresi basılıyor.
  #
  # ⚠️ DENETİM YAPILAMAZSA FOTOĞRAF KABUL EDİLİR (kota, ağ, anahtar
  # yok). Bu bir EK güvence, ön şart değil.
  # "Başka fotoğraf" düğmesine basınca kaç aday sunulsun?
  #
  # ⚠️ NEDEN ÇOKLU (4 Eyl 2026): eskiden tek görsel üretilip
  # "kullan / başka dene" soruluyordu. Beğenilmezse job baştan
  # uyanıyordu — Actions'ı uyandırmak 40-90 sn ve kullanıcı üç kez
  # basınca üç ayrı job açılıyordu. Üçünü TEK job'da üretmek
  # (~90 sn) üç ayrı uyanmadan (~210 sn + bekleme) ucuz.
  #
  # ⚠️ Her aday ~8-11 sn (slayt + Vision + imgbb). 3'ten fazlası
  # hem job'ı uzatıyor hem Telegram albümünü okunmaz yapıyor.
  gorsel_aday_adedi: 3

  vision_denetim: true

  # og:image bazen sitenin logosu ya da paylaşım rozeti oluyor; bu
  # genişliğin altındakiler eleniyor, yoksa büyütülünce bulanık çıkıyor.
  # ⚠️ ESKİDEN 600'DÜ VE YÜKSEKLİK HİÇ DENETLENMİYORDU.
  # og:image katmanı zincirin BİRİNCİ sırasında; 1200x400 gibi geniş
  # bantlı bir foto bu eşiği geçip 4:5'e kırpılınca ciddi kalite kaybı
  # oluyordu. Slayt 1080x1350 basıldığı için kaynak en az o kadar olmalı.
  # ⚠️ ESKİ DEĞER (1080x800) HABERİN KENDİ FOTOĞRAFINI TAMAMEN
  # ENGELLİYORDU. 21 Ağu 2026'da ölçüldü: son 14 haberin 14'ü de
  # boyuttan elendi ve hepsi Pexels'e düştü — kullanıcı "görseller
  # çok genel, hep aynı şeyler" dedi, sebebi buydu.
  #
  # Haber sitelerinin neredeyse tamamı standart OG boyutu kullanıyor:
  #   1280x720 (16:9) · 1200x630 (1.91:1)
  # İkisi de 800 yükseklik eşiğine takılıyordu.
  #
  # ⚠️ `haber_gorseli_asgari_genislik/yukseklik` KALDIRILDI (4 Eyl 2026).
  # Boyut denetimi artık `src/gorsel_kalite.gorsel_kalite_denetle()`
  # içinde ve DAHA AKILLI: düz genişlik/yükseklik eşiği yerine
  # fotoğrafın hedef dikey orana KIRPILDIKTAN SONRAKİ gerçek piksel
  # yoğunluğunu ölçüyor (`kirpma_olcegi_hesapla`). 1200x630 ile
  # 630x1200 aynı piksel sayısına sahip ama dikey tuvale kırpıldığında
  # bambaşka sonuç veriyor; düz eşik bunu göremiyordu.
  #
  # ⚠️ İki ayar bir süredir ÖLÜYDÜ — yalnızca test dosyası okuyordu,
  # üretim kodu hiç bakmıyordu. Testler `scripts/`ten `tests/`e
  # taşınınca "ölü ayar" denetimi bunu yakaladı.
  #
  # CLAUDE.md'deki ölçülmüş kural yeni kapıda DOĞRULANDI:
  #   1280x720 ✓  1200x630 ✓  1920x1080 ✓  1200x675 ✓
  #   864x486 ✗   640x360 ✗
  # Düz zeminli sayfalar (detay slaytları) — fotoğraf yok, yüksek
  # kalite dosyayı gereksiz şişiriyor.
  jpeg_kalite: 90
  # ⚠️ FOTOĞRAF ARKA PLANLI slaytlar için ayrı kalite. Instagram dosya
  # sınırı 8 MB, bizim slaytlar ~200 KB — artırmak için bol alan var.
  # imgbb çökerse catbox.moe'ye düş. 21 Ağu 2026'da imgbb bakıma
  # girdi ve bot hiçbir post atamadı — tek barındırıcı tek arıza
  # noktasıydı. false yaparsan imgbb patladığında tur da düşer.
  yedek_barindirici: true

  jpeg_kalite_foto: 95          # Instagram PNG kabul etmiyor, JPEG şart
  deneme_sayisi: 3
  zaman_asimi: 180         # görsel üretimi metinden yavaş


# =========================================================
#  IMGBB (Adım 4a — görsel barındırma)
#  Anahtar .env'de: IMGBB_API_KEY
#
#  Neden var: Instagram görseli dosya olarak kabul etmiyor, herkese
#  açık bir URL istiyor. Sunucumuz olmadığı için imgbb ara depo.
# =========================================================
imgbb:
  # Yüklenen görsel kaç saniye sonra kendiliğinden silinsin?
  # Instagram yayında kendi kopyasını aldığı için kısa tutmak güvenli.
  # 172800 = 2 gün. Onay gecikse bile (akşam hazırla, gece onayla)
  # rahatça yeter, ama imgbb hesabı çöp doldurmaz.
  omur_saniye: 172800

  deneme_sayisi: 3
  zaman_asimi: 120        # 10 görsel yükleneceği için cömert davrandık


# =========================================================
#  INSTAGRAM (Adım 4)
#  Anahtarlar .env'de: IG_USER_ID, IG_ACCESS_TOKEN,
#                      META_APP_ID, META_APP_SECRET
# =========================================================
instagram:
  # HANGİ HESABA POST ATILACAK — bunu boş bırakma.
  #
  # Jetonun birden fazla sayfaya erişimi var (DailyBrief, Animarch Studio,
  # Edm Yapı). Kod "ilk bulduğu" hesaba yazarsa yanlış hesaba post gider —
  # ilk denemede tam olarak bu oldu, emlak hesabını seçmişti.
  # O yüzden hedef hesap adı burada AÇIKÇA yazılı ve kod eşleşme
  # bulamazsa çalışmayı reddediyor.
  hesap_kullanici_adi: "dailybrief.co"

  # Graph API sürümü. Meta yaklaşık 2 yıl geriye dönük destek veriyor,
  # ama sürüm eskidikçe uç noktalar kapanabiliyor. Kırılırsa burayı
  # güncelle — kodda sürüm gömülü değil.
  api_surumu: "v23.0"

  # Container hazır olana kadar bekleme (carousel'de her görsel için
  # ayrı container oluşuyor, hepsinin işlenmesi zaman alıyor)
  hazir_bekleme_saniye: 5
  hazir_azami_deneme: 12

  zaman_asimi: 60


# =========================================================
#  HABER KAYNAKLARI
#  aktif: false yaparsan o kaynak atlanır (silmene gerek yok)
#  agirlik: haber seçerken önceliği belirler (yüksek = önce)
# =========================================================
kaynaklar:

  # ⚠️ SIRA ÖNEMLİ — KATEGORİ BESLEMELERİ ÖNCE.
  #
  # `haberler.link` UNIQUE ve ilk gelen kaynak kazanıyor. Genel akışlar
  # (TRT sondakika, AA guncel) TÜM kategorileri içeriyor; önce
  # çekildiklerinde ekonomi/bilim/kültür haberlerini "turkiye" etiketiyle
  # kaydediyor ve kategori beslemeleri komple tekrar sayılıp eleniyor.
  #
  # Ölçüldü (18 Ağu 2026): AA Ekonomi ve TRT Ekonomi'nin ilk 10 haberinin
  # 10'u da zaten veritabanındaydı — "Anadolu Ajansı / turkiye" ve
  # "TRT Haber / turkiye" olarak. Yani eklenen 7 kategori kaynağından
  # HİÇ haber girmiyordu ve o kategoriler hiç dolmayacaktı.
  #
  # Kategori beslemeleri önce çekilince haber doğru etiketle giriyor;
  # yalnızca genel akışta olan haberler yine "turkiye" oluyor.

  # ---------- KATEGORİ BESLEMELERİ ----------
  - ad: "AA Bilim-Teknoloji"
    gosterim_adi: "AA"
    url: "https://www.aa.com.tr/tr/rss/default?cat=bilim-teknoloji"
    kategori: "bilim"
    agirlik: 9
    aktif: true

  - ad: "AA Ekonomi"
    gosterim_adi: "AA"
    url: "https://www.aa.com.tr/tr/rss/default?cat=ekonomi"
    kategori: "ekonomi"
    agirlik: 9
    aktif: true

  - ad: "BloombergHT"
    gosterim_adi: "BLOOMBERG HT"
    url: "https://www.bloomberght.com/rss"
    kategori: "ekonomi"
    agirlik: 10
    aktif: true

  - ad: "Borsa Gündem"
    gosterim_adi: "BORSA GÜNDEM"
    url: "https://www.borsagundem.com/rss"
    kategori: "ekonomi"

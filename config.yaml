  - ad: "Habertürk Yaşam"
    url: "https://www.haberturk.com/rss/kategori/yasam.xml"
    kategori: "yasam"
    agirlik: 7
    aktif: true

  - ad: "Habertürk Spor"
    url: "https://www.haberturk.com/rss/kategori/spor.xml"
    kategori: "spor"
    agirlik: 7
    aktif: true

  # ---------- TRT KATEGORİ BESLEMELERİ (18 Ağu 2026) ----------
  # TRT ağırlığı 10 olan en güvendiğimiz kaynak ama yalnızca genel akışı
  # (sondakika.rss) kullanıyorduk. Kategori beslemeleri farklı adreste
  # ve ÖZEL FORMATTA (`<haberler><haber>`); standart okuyucu boş sanıp
  # düşürüyordu. `fetch_news._trt_ayristir` bunun için yazıldı.
  #
  # ⚠️ YALNIZCA 3 KATEGORİ CANLI. Ölçüldü: spor beslemesi 11 GÜN,
  # çevre 25 saat eski; kültür-sanat, sağlık ve eğitim de %20-30 taze.
  # Bunlar eklenseydi yaş filtresine takılıp boşuna istek olurdu.
  # Yeni kategori eklemeden önce TAZELİĞİ ÖLÇ.
  - ad: "TRT Ekonomi"
    url: "https://www.trthaber.com/xml_mobile.php?tur=xml_genel&kategori=ekonomi"
    kategori: "ekonomi"
    agirlik: 10
    aktif: true

  - ad: "TRT Dünya"
    url: "https://www.trthaber.com/xml_mobile.php?tur=xml_genel&kategori=dunya"
    kategori: "dunya"
    agirlik: 10
    aktif: true

  - ad: "TRT Teknoloji"
    url: "https://www.trthaber.com/xml_mobile.php?tur=xml_genel&kategori=teknoloji"
    kategori: "teknoloji"
    agirlik: 10
    aktif: true

  # ---------- EK GÜVENİLİR KAYNAKLAR ----------
  # Tazelik süzgecinden geçenler (24 saat içindeki haber oranı):
  #   AA Dünya %100 · Independent Türkçe %100
  # Elenenler: Habertürk Sağlık %23, NTV Sağlık %5, Habertürk Kültür %0,
  # Hürriyet Teknoloji %3 — beslemeler güncellenmiyor.
  # ⚠️ Milliyet'in "gündem" ve "ekonomi" beslemeleri BİREBİR AYNI
  # (20/20 ortak haber); ikisi birden eklenirse aynı haber iki kez çekilir.
  - ad: "AA Dünya"
    url: "https://www.aa.com.tr/tr/rss/default?cat=dunya"
    kategori: "dunya"
    agirlik: 9
    aktif: true

  - ad: "Independent Türkçe"
    url: "https://www.indyturk.com/rss.xml"
    kategori: "turkiye"
    agirlik: 6
    aktif: true

  # Motor sporları: F1, MotoGP, ralli. Türkçe ve uluslararası marka.
  # ⚠️ TAZELİK DÜŞÜK (%24) ama bu kaynağın kusuru değil — F1 haftalık
  # bir spor, yarış dışı günlerde doğal olarak sessiz. Yarış haftalarında
  # akış hızlanıyor.
  #
  # Kategori "spor" bırakıldı, ayrı kategori açılmadı: seçim filtresi
  # kategori başına 3 haber alıyor; ayrı kategori olsaydı turda 3 futbol
  # + 3 motor sporu çıkıp spor ağırlığı iki katına çıkardı.
  - ad: "Motorsport TR"
    url: "https://tr.motorsport.com/rss/all/news/"
    kategori: "spor"
    agirlik: 7
    aktif: true

# =========================================================
#  SEÇİM ÇEŞİTLİLİĞİ (18 Ağu 2026)
#
#  Seçim düz skor sıralamasıydı ve aynı olayın haberleri birbirine yakın
#  puan aldığı için üst üste diziliyordu: 16 Ağu turunda 10 haberin 6'sı
#  İsrail/Gazze, 8'i tek kaynaktandı. Takipçi için bu "günün özeti"
#  değil, tek konunun tekrarı.
#
#  Kurallar turu EKSİK BIRAKMAZ: havuz darsa gevşetilip en yüksek
#  puanlılarla dolduruluyor.
# =========================================================
secim:
  # ⚠️ TUR SABİT 10 SLAYT DEĞİL. Eşiği geçen kaç haber varsa o kadar
  # slayt üretiliyor: sakin gün 6-7, yoğun gün 10 (Instagram sınırı).
  #
  # Önce havuzdan hep en iyi 10 alınıyordu ve havuz doluyken 10'uncu
  # haber "belediye şu toplantıyı yaptı" seviyesine düşebiliyordu.
  # Zayıf haberle slayt doldurmak turun tamamını sıradanlaştırıyor.
  #
  # 6: "çoğu insan bilmek ister" alt sınırı. Yükseltirsen turlar kısalır
  # ama sertleşir; 7-8 yapmak sakin günlerde 3-4 slayta düşürebilir.
  asgari_onem_puani: 6

  # İki başlık kaç ortak anahtar kelime paylaşırsa "aynı olay" sayılsın.
  # 2 ölçüldü: "İsrail ... Gazze" ile "İsrail ... Lübnan" ayrışıyor ama
  # aynı olayın iki farklı kaynaktaki hâli birleşiyor.
  #
  # ⚠️ KATEGORİ VE KAYNAK KOTASI KALDIRILDI (18 Ağu 2026). "Kategori
  # başına 3, kaynak başına 4" kuralı vardı; gündem gerçekten tek konuya
  # kilitlendiğinde (deprem, seçim gecesi) o haberleri dışarıda bırakıp
  # yerlerine önemsizlerini alıyordu. Gündemi olaylar belirlemeli.
  konu_ortak_kelime_esigi: 2


# ----------------------------------------------------------------------
# İÇERİK FİLTRESİ — Instagram erişim kısıtlamasına karşı
# ----------------------------------------------------------------------
# Instagram bazı kelimeleri içeren postların erişimini sessizce düşürüyor
# ("shadowban"): uyarı gelmez, sadece kimse görmez. Kelimenin ortasına
# yıldız koymak bunu aşıyor ("intihar" -> "int*har").
#
# LİSTE BİLEREK KISA. Aşırı sansürün bedeli var: bir haber hesabında
# "c*nayet" yazmak amatör duruyor ve Instagram haber değeri taşıyan
# içeriğe zaten istisna tanıyor. Bu yüzden ölüm, kaza, saldırı, cinayet
# gibi GÜNDELİK HABER kelimeleri listede YOK. Buraya kelime eklemek
# serbest ama her ekleme okunabilirlikten götürüyor.
icerik_filtresi:
  aktif: true

  # Caption ve hashtag'lerde uygulanır. Slayt görselindeki başlığa
  # varsayılan olarak DOKUNULMUYOR: Instagram görsel içi metni caption
  # kadar agresif taramıyor, ama yıldızlı başlık slaytta çok göze batıyor.
  captionda: true
  # NOT: "gorselde" ayarı KALDIRILDI. Slayt görsellerindeki başlığa
  # filtre uygulanmıyor ve uygulanması da istenmiyor: Instagram görsel
  # içi metni caption kadar agresif taramıyor, ama yıldızlı başlık
  # slaytta çok göze batıyor. Fikir değişirse slaytlar.py'de
  # filtre.metni_yumusat() çağrısı eklenmeli.

  # Kelime KÖKÜ yazılır; ekli hâlleri de yakalanır ("intihar" -> "intiharı").
  yumusatilacak:
    - intihar
    - tecavüz
    - porno
    - fuhuş
    - uyuşturucu
    - kokain
    - eroin
    - esrar
    - taciz
    - istismar
    - işkence
    - katliam
    - terör

  # Etiketlerde yıldızlama işe yaramaz (kimse "#int*har" aramıyor),
  # bu yüzden riskli etiketler tamamen ATILIR.
  yasakli_hashtagler:
    - intihar
    - tecavuz
    - porno
    - fuhus
    - uyusturucu
    - teror
    - katliam
    - istismar
    - taciz

# ----------------------------------------------------------------------
# SOSYAL KANALLAR
# ----------------------------------------------------------------------
# Slaytların alt bilgisinde küçük ikonlar olarak gösteriliyor:
# "bu içerik şu kanallarda da var" demek için.
#
# İkonlar resmi logoların birebir kopyası DEĞİL, kodla çizilen
# tanınabilir sadeleştirmeler (src/make_image.py). Sebep: resmi logolar
# SVG ve Pillow SVG okumuyor; dönüştürmek GitHub runner'da riskli bir
# sistem bağımlılığı gerektiriyor.
#
# Listeden çıkarmak yeterli — kanal kapanırsa ikonu da kaybolur.
sosyal:
  # Instagram'a yayınlanan içerik Facebook sayfasına da gitsin mi?
  # Aynı sayfa jetonu kullanılıyor (pages_manage_posts izniyle), ek
  # anahtar veya yenileme döngüsü yok. Carousel Facebook'ta ALBÜM
  # olarak paylaşılıyor.
  #
  # İKİNCİL KANAL: Facebook paylaşımı patlarsa Instagram postu yayında
  # kalıyor, yalnızca Telegram sonucuna not düşülüyor.
  facebooka_da_at: true

  # Threads'e de paylaşılsın mı?
  # ⚠️ AYRI JETON: Instagram/Facebook jetonu Threads'te ÇALIŞMIYOR.
  # graph.threads.net kendi API'si ve kendi yetkilendirmesi var.
  # .env'de THREADS_ACCESS_TOKEN + THREADS_USER_ID gerekiyor.
  # Anahtar yoksa paylaşım sessizce atlanıyor, tur düşmüyor.
  threadse_de_at: true

  # Slaytların alt bilgisinde gösterilen kanal ikonları
  # ⚠️ X BİLEREK LİSTEDE YOK (18 Ağu 2026). Kod ve anahtarlar hazır ama
  # X API artık kredi bazlı: hesapta ücretsiz kota $0 ve post atmak para
  # istiyor. Sahip olmadığımız bir kanalın logosunu basmak yanlış olur.
  # Tekrar açılırsa buraya `- x` eklemek yeterli, logosu assets/icons'ta
  # duruyor.
  kanallar:
    - instagram
    - threads
    - facebook
